# Pour la documentation de référence détaillée de configuration, consultez :
# https://supabase.com/docs/guides/local-development/cli/config
# Chaîne utilisée pour distinguer différents projets Supabase sur le même hôte.
# Par défaut, le nom du répertoire de travail lors de l’exécution de `supabase init` est utilisé.
project_id = "smart-fleet-africa"

[api]
enabled = true
# Port à utiliser pour l’URL de l’API.
port = 54321
# Schémas à exposer dans votre API. Les tables, vues et procédures stockées de ce schéma
# obtiendront des endpoints API. Les schémas `public` et `graphql_public` sont inclus par défaut.
schemas = ["public", "graphql_public"]
# Schémas supplémentaires à ajouter au `search_path` de chaque requête.
extra_search_path = ["public", "extensions"]
# Nombre maximum de lignes renvoyées par une vue, table ou procédure stockée.
# Limite la taille de payload pour les requêtes accidentelles ou malveillantes.
max_rows = 1000

[api.tls]
# Activer localement les endpoints HTTPS avec un certificat auto-signé.
enabled = false
# Chemins vers la paire de certificats auto-signés.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port à utiliser pour l’URL de la base locale.
port = 54322
# Port utilisé par la commande `db diff` pour initialiser la base shadow.
shadow_port = 54320
# Durée maximale d’attente du health check au démarrage de la base locale.
health_timeout = "2m"
# Version majeure de base de données à utiliser. Elle doit être identique à celle de votre base distante.
# Exécutez `SHOW server_version;` sur la base distante pour vérifier.
major_version = 17

[db.pooler]
enabled = false
# Port à utiliser pour le pooler de connexions local.
port = 54329
# Indique quand une connexion serveur peut être réutilisée par d’autres clients.
# Configurez un des modes de pooler supportés : `transaction`, `session`.
pool_mode = "transaction"
# Nombre de connexions serveur autorisées par paire utilisateur/base.
default_pool_size = 20
# Nombre maximal de connexions client autorisées.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# Si désactivé, les migrations seront ignorées pendant un `db push` ou `db reset`.
enabled = true
# Spécifie une liste ordonnée de fichiers de schéma décrivant votre base.
# Prend en charge les motifs glob relatifs au dossier supabase : "./schemas/*.sql"
schema_paths = []

[db.seed]
# Si activé, alimente la base après les migrations lors d’un `db reset`.
enabled = true
# Spécifie une liste ordonnée de fichiers seed à charger pendant `db reset`.
# Prend en charge les motifs glob relatifs au dossier supabase : "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Activer la gestion des restrictions réseau.
enabled = false
# Liste des blocs CIDR IPv4 autorisés à se connecter à la base.
# Par défaut, toutes les connexions IPv4 sont autorisées. Mettre un tableau vide pour bloquer toutes les IP.
allowed_cidrs = ["0.0.0.0/0"]
# Liste des blocs CIDR IPv6 autorisés à se connecter à la base.
# Par défaut, toutes les connexions IPv6 sont autorisées. Mettre un tableau vide pour bloquer toutes les IP.
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true
# Lier realtime via IPv4 ou IPv6. (par défaut : IPv4)
# ip_version = "IPv6"
# Longueur maximale en octets des en-têtes de requête HTTP. (par défaut : 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port à utiliser pour Supabase Studio.
port = 54323
# URL externe du serveur API auquel le frontend se connecte.
api_url = "http://127.0.0.1"
# Clé API OpenAI à utiliser pour Supabase AI dans Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Serveur de test email. Les emails envoyés en local ne sont pas réellement expédiés :
# ils sont surveillés, et vous pouvez voir ceux qui auraient été envoyés via l’interface web.
[inbucket]
enabled = true
# Port à utiliser pour l’interface web du serveur de test email.
port = 54324
# Décommentez pour exposer des ports supplémentaires pour tester des applications qui envoient des emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# Taille maximale de fichier autorisée (ex. "5MB", "500KB").
file_size_limit = "50MiB"

# Décommentez pour configurer des buckets de stockage locaux
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Autoriser les connexions via des clients compatibles S3
[storage.s3_protocol]
enabled = true

# L’API de transformation d’image est disponible avec le plan Supabase Pro.
# [storage.image_transformation]
# enabled = true

# Stocker les données analytiques dans S3 pour exécuter des jobs ETL sur Iceberg Catalog
# Cette fonctionnalité est uniquement disponible sur la plateforme hébergée.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets est disponible avec le plan Supabase Pro.
# [storage.analytics.buckets.my-warehouse]

# Stocker les embeddings vectoriels dans S3 pour des jeux de données volumineux et durables
# Cette fonctionnalité est uniquement disponible sur la plateforme hébergée.
[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

# Vector Buckets est disponible avec le plan Supabase Pro.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# URL de base de votre site web. Utilisée comme liste d’autorisation pour les redirections
# et pour construire les URLs utilisées dans les emails.
site_url = "https://www.e-samba.com"
# Liste des URLs autorisées pour les redirections auth (web + mobile Capacitor).
# Poussée vers le projet lié : npm run supabase:push-auth-config (scripts/apply-mobile-store-setup.mjs).
additional_redirect_urls = [
  "esamba://auth/callback",
  "esamba://auth/update-password",
  "http://127.0.0.1:5173",
  "http://localhost:3000/**",
  "http://localhost:5173",
  "http://localhost:8080/**",
  "http://localhost:8080/auth",
  "http://smart-fleet-africa.vercel.app/**",
  "https://127.0.0.1:3000",
  "https://*.vercel.app/**",
  "https://app.e-samba.com/**",
  "https://e-samba.com/**",
  "https://esamba-web.vercel.app/**",
  "https://www.e-samba.com/**",
  "https://www.e-samba.com/auth/callback",
  "https://www.e-samba.com/auth/callback/**",
  "https://www.e-samba.com/auth/update-password",
  "https://www.e-samba.com/auth/update-password/**",
]
# Durée de validité des tokens, en secondes. Par défaut 3600 (1 heure), maximum 604800 (1 semaine).
jwt_expiry = 3600
# URL émettrice JWT. Si non définie, prend l’URL API locale par défaut (http://127.0.0.1:<port>/auth/v1).
# jwt_issuer = ""
# Chemin vers la clé de signature JWT. NE COMMITTEZ PAS votre fichier de clés de signature dans git.
# signing_keys_path = "./signing_keys.json"
# Si désactivé, le refresh token n’expirera jamais.
enable_refresh_token_rotation = true
# Autorise la réutilisation des refresh tokens après expiration, jusqu’à l’intervalle indiqué en secondes.
# Nécessite enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Autoriser/interdire les nouvelles inscriptions utilisateur sur votre projet.
enable_signup = true
# Autoriser/interdire les connexions anonymes à votre projet.
enable_anonymous_sign_ins = false
# Autoriser/interdire le test de liaison manuelle des comptes
enable_manual_linking = false
# Les mots de passe plus courts que cette valeur seront rejetés comme faibles. Minimum 6, recommandé 8 ou plus.
minimum_password_length = 6
# Les mots de passe ne respectant pas ces exigences seront rejetés comme faibles.
# Valeurs supportées : `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
password_requirements = ""

[auth.rate_limit]
# Nombre d’emails pouvant être envoyés par heure. Nécessite auth.email.smtp activé.
email_sent = 2
# Nombre de SMS pouvant être envoyés par heure. Nécessite auth.sms activé.
sms_sent = 30
# Nombre de connexions anonymes possibles par heure et par adresse IP. Nécessite enable_anonymous_sign_ins = true.
anonymous_users = 30
# Nombre de sessions pouvant être rafraîchies sur un intervalle de 5 minutes par adresse IP.
token_refresh = 150
# Nombre de requêtes d’inscription et de connexion possibles sur 5 minutes par adresse IP (hors utilisateurs anonymes).
sign_in_sign_ups = 30
# Nombre de vérifications OTP / Magic link possibles sur 5 minutes par adresse IP.
token_verifications = 30
# Nombre de connexions Web3 possibles sur 5 minutes par adresse IP.
web3 = 30

# Configurez un des fournisseurs captcha supportés : `hcaptcha`, `turnstile`.
# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Utiliser un serveur SMTP prêt pour la production
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# Décommentez pour personnaliser le template email
# [auth.email.template.invite]
# subject = "Vous avez été invité"
# content_path = "./supabase/templates/invite.html"

# Décommentez pour personnaliser le template d’email de notification
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Votre mot de passe a été modifié"
# content_path = "./templates/password_changed_notification.html"

[auth.sms]
# Autoriser/interdire les nouvelles inscriptions utilisateur via SMS.
enable_signup = false
# Si activé, les utilisateurs doivent confirmer leur numéro de téléphone avant de se connecter.
enable_confirmations = false
# Template pour envoyer l’OTP aux utilisateurs
template = "Votre code est {{ .Code }}"
# Contrôle le délai minimal à respecter avant d’envoyer un nouvel OTP SMS.
max_frequency = "5s"

# Utiliser une map prédéfinie numéro de téléphone → OTP pour les tests.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configurer les délais d’expiration des sessions connectées.
# [auth.sessions]
# Forcer la déconnexion après la durée spécifiée.
# timebox = "24h"
# Forcer la déconnexion si l’utilisateur est inactif plus longtemps que la durée spécifiée.
# inactivity_timeout = "8h"

# Ce hook s’exécute avant la création d’un nouvel utilisateur et permet de rejeter la requête
# selon l’objet utilisateur entrant.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# Ce hook s’exécute avant l’émission d’un token et permet d’ajouter des claims supplémentaires
# selon la méthode d’authentification utilisée.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configurez un des fournisseurs SMS supportés : `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# NE COMMITTEZ PAS votre token d’auth Twilio dans git. Utilisez la substitution par variable d’environnement :
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# L’authentification multifacteur est disponible avec le plan Supabase Pro.
[auth.mfa]
# Contrôle combien de facteurs MFA peuvent être enrôlés en même temps par utilisateur.
max_enrolled_factors = 10

# Contrôler la MFA via une application Authenticator (TOTP)
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Configurer la MFA via messagerie téléphonique
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Votre code est {{ .Code }}"
max_frequency = "5s"

# Configurer la MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Utiliser un fournisseur OAuth externe. La liste complète des fournisseurs est : `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# NE COMMITTEZ PAS le secret de votre fournisseur OAuth dans git. Utilisez la substitution
# par variable d’environnement :
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Remplace l’`auth redirectUrl` par défaut.
redirect_uri = ""
# Remplace l’URL du fournisseur d’auth par défaut. Utilisé pour supporter gitlab auto-hébergé,
# Azure mono-tenant, ou tout autre fournisseur OIDC tiers.
url = ""
# Si activé, la vérification du nonce est ignorée. Requis pour la connexion locale avec Google auth.
skip_nonce_check = false
# Si activé, permet à l’utilisateur de s’authentifier même si le fournisseur ne renvoie pas d’adresse email.
email_optional = false

# Autoriser les détenteurs de wallet Solana à se connecter via le standard Sign in with Solana (SIWS, EIP-4361).
# Vous pouvez configurer la limite de débit "web3" dans [auth.rate_limit] et configurer [auth.captcha] en auto-hébergement.
[auth.web3.solana]
enabled = false

# Utiliser Firebase Auth comme fournisseur tiers en complément de Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Utiliser Auth0 comme fournisseur tiers en complément de Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Utiliser AWS Cognito (Amplify) comme fournisseur tiers en complément de Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Utiliser Clerk comme fournisseur tiers en complément de Supabase Auth.
[auth.third_party.clerk]
enabled = false
# À obtenir depuis https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# Configuration du serveur OAuth
[auth.oauth_server]
# Activer la fonctionnalité serveur OAuth
enabled = false
# Chemin de l’interface du flux de consentement OAuth
authorization_url_path = "/oauth/consent"
# Autoriser l’enregistrement dynamique des clients
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Politiques de requête supportées : `oneshot`, `per_worker`.
# `per_worker` (par défaut) — active le hot reload en développement local.
# `oneshot` — mode de secours si le hot reload cause des problèmes (ex. gros dépôts ou symlinks).
policy = "per_worker"
# Port pour attacher l’inspecteur Chrome au débogage des edge functions.
inspector_port = 8083
# Version majeure de Deno à utiliser.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# Configurez un des backends supportés : `postgres`, `bigquery`.
backend = "postgres"

# Les fonctionnalités expérimentales peuvent être dépréciées à tout moment
[experimental]
# Configure le moteur de stockage Postgres pour utiliser OrioleDB (S3)
orioledb_version = ""
# Configure l’URL du bucket S3, ex. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configure la région du bucket S3, ex. us-east-1
s3_region = "env(S3_REGION)"
# Configure AWS_ACCESS_KEY_ID pour le bucket S3
s3_access_key = "env(S3_ACCESS_KEY)"
# Configure AWS_SECRET_ACCESS_KEY pour le bucket S3
s3_secret_key = "env(S3_SECRET_KEY)"

# Edge Functions déclarées pour le déploiement auto sur branches (Supabase branching).
# verify_jwt aligné sur scripts/deploy-missing-edge-functions.mjs (NO_JWT).

[functions.otp-send]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.process-whatsapp-retries]
verify_jwt = false

[functions.notch-pay-webhook]
verify_jwt = false

[functions.billing-lifecycle-cron]
verify_jwt = false

[functions.expire-demo-accounts]
verify_jwt = false

[functions.expire-prospect-accounts]
verify_jwt = false

[functions.demo-magic-link]
verify_jwt = false

[functions.retention-nudge]
verify_jwt = false

[functions.refresh-analytics]
verify_jwt = false

[functions.process-notification-queue]
verify_jwt = false

[functions.generate-scheduled-report]
verify_jwt = false

[functions.dashcam-ai-webhook]
verify_jwt = false

[functions.support-notify]
verify_jwt = false

[functions.create-prospect-account]
verify_jwt = false

[functions.session-tracker]
verify_jwt = true

[functions.revoke-session]
verify_jwt = true

[functions.send-notification]
verify_jwt = true

[functions.send-whatsapp]
verify_jwt = true

[functions.gps-ingest]
verify_jwt = true

[functions.generate-voice-coaching]
verify_jwt = true

[functions.onboarding-sequence]
verify_jwt = true
