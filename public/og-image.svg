<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a2035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Orange accent bar -->
  <rect x="80" y="200" width="6" height="120" fill="url(#accent)" rx="3"/>

  <!-- Brand name -->
  <text x="110" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-2">E-Samba</text>

  <!-- Tagline -->
  <text x="110" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">Gestion intelligente de flotte en Afrique Centrale</text>

  <!-- Feature pills -->
  <g transform="translate(110, 360)">
    <rect width="180" height="40" rx="20" fill="#f97316" opacity="0.15"/>
    <text x="90" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#f97316" text-anchor="middle">Suivi véhicules</text>

    <rect x="196" width="160" height="40" rx="20" fill="#3b82f6" opacity="0.15"/>
    <text x="276" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle">Alertes auto</text>

    <rect x="372" width="200" height="40" rx="20" fill="#10b981" opacity="0.15"/>
    <text x="472" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#34d399" text-anchor="middle">Rapports ROI</text>
  </g>

  <!-- Decorative truck icon (simplified) -->
  <g transform="translate(820, 200)" opacity="0.12">
    <rect x="20" y="80" width="260" height="140" rx="8" fill="#ffffff"/>
    <rect x="20" y="60" width="140" height="80" rx="8" fill="#ffffff"/>
    <circle cx="80" cy="235" r="30" fill="#0f0f0f" stroke="#ffffff" stroke-width="8"/>
    <circle cx="230" cy="235" r="30" fill="#0f0f0f" stroke="#ffffff" stroke-width="8"/>
  </g>

  <!-- Website URL -->
  <text x="110" y="560" font-family="system-ui, sans-serif" font-size="22" fill="#475569">www.e-samba.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
