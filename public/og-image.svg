<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>

    <!-- Fond principal dégradé diagonal sombre -->
    <linearGradient id="bg-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#080f1e"/>
      <stop offset="50%"  stop-color="#0d1929"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>

    <!-- Accent vert e-samba -->
    <linearGradient id="green-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Vert pour logo fond -->
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow radial vert (halo gauche) -->
    <radialGradient id="glow-left" cx="20%" cy="55%" r="45%">
      <stop offset="0%"   stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow radial bleu (halo droit) -->
    <radialGradient id="glow-right" cx="85%" cy="40%" r="40%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Fond card KPI -->
    <linearGradient id="card-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1a2744" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f1e38" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Mask pour rogner les éléments -->
    <clipPath id="bounds">
      <rect width="1200" height="630"/>
    </clipPath>

    <!-- Filtre blur léger pour glow -->
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="blur-md">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

  </defs>

  <g clip-path="url(#bounds)">

    <!-- ══ FOND ══ -->
    <rect width="1200" height="630" fill="url(#bg-main)"/>
    <rect width="1200" height="630" fill="url(#glow-left)"/>
    <rect width="1200" height="630" fill="url(#glow-right)"/>

    <!-- ══ GRILLE SUBTILE (dot grid) ══ -->
    <!-- Lignes horizontales -->
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>
    <!-- Lignes verticales -->
    <line x1="200" y1="0" x2="200" y2="630" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>

    <!-- ══ BARRE ACCENT HAUT ══ -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#green-accent)"/>
    <!-- Glow sous la barre top -->
    <rect x="0" y="3" width="1200" height="12" fill="url(#green-accent)" opacity="0.08" filter="url(#blur-sm)"/>

    <!-- ══ ÉLÉMENT DÉCORATIF : cercle géométrique fond droit ══ -->
    <!-- Grand cercle fantôme -->
    <circle cx="920" cy="315" r="240" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>
    <circle cx="920" cy="315" r="180" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.15"/>
    <circle cx="920" cy="315" r="120" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.4"/>
    <!-- Points aux intersections -->
    <circle cx="920" cy="75"  r="3" fill="#10b981" opacity="0.3"/>
    <circle cx="920" cy="555" r="3" fill="#10b981" opacity="0.3"/>
    <circle cx="680" cy="315" r="3" fill="#10b981" opacity="0.3"/>
    <circle cx="1160" cy="315" r="3" fill="#10b981" opacity="0.3"/>

    <!-- ══ ZONE GAUCHE : IDENTITÉ ══ -->

    <!-- Logo carré arrondi -->
    <rect x="64" y="152" width="68" height="68" rx="16" fill="url(#logo-bg)"/>
    <!-- Lettre S stylisée dans le logo -->
    <text x="98" y="201" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="34" font-weight="700" fill="white" text-anchor="middle"
          letter-spacing="-1">S</text>

    <!-- Nom produit -->
    <text x="64" y="282"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="64" font-weight="800" fill="#f1f5f9"
          letter-spacing="-2">e-samba</text>

    <!-- Ligne décorative sous le nom -->
    <rect x="64" y="298" width="240" height="2.5" rx="1.5" fill="url(#green-accent)" opacity="0.9"/>

    <!-- Tagline principale -->
    <text x="64" y="346"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="22" font-weight="400" fill="#94a3b8"
          letter-spacing="0.2">Gestion intelligente de flotte</text>

    <!-- Tagline secondaire -->
    <text x="64" y="376"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="22" font-weight="600" fill="#10b981"
          letter-spacing="0.2">Afrique Centrale</text>

    <!-- ── Pays CEMAC ── -->
    <g transform="translate(64, 412)">
      <!-- Drapeaux texte sous forme de pills -->
      <rect width="110" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.4"/>
      <text x="55" y="17.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#34d399" text-anchor="middle">🇨🇲 Cameroun</text>

      <rect x="118" width="88" height="26" rx="13" fill="#10b981" fill-opacity="0.08" stroke="#1e3a5f" stroke-width="0.75"/>
      <text x="162" y="17.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">🇹🇩 Tchad</text>

      <rect x="214" width="72" height="26" rx="13" fill="#10b981" fill-opacity="0.08" stroke="#1e3a5f" stroke-width="0.75"/>
      <text x="250" y="17.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">🇬🇦 Gabon</text>

      <rect x="294" width="72" height="26" rx="13" fill="#10b981" fill-opacity="0.08" stroke="#1e3a5f" stroke-width="0.75"/>
      <text x="330" y="17.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">🇨🇬 Congo</text>
    </g>

    <!-- ── Features strip bas gauche ── -->
    <g transform="translate(64, 462)">
      <!-- Realtime -->
      <circle cx="8"  cy="9" r="4" fill="#10b981"/>
      <text x="18" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b">Realtime</text>
      <!-- Offline -->
      <circle cx="108" cy="9" r="4" fill="#3b82f6"/>
      <text x="118" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b">Offline-first</text>
      <!-- PWA -->
      <circle cx="222" cy="9" r="4" fill="#8b5cf6"/>
      <text x="232" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b">PWA · iOS · Android</text>
      <!-- IA -->
      <circle cx="364" cy="9" r="4" fill="#f59e0b"/>
      <text x="374" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b">IA prédictive</text>
    </g>

    <!-- URL en bas à gauche -->
    <text x="64" y="578"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="16" font-weight="500" fill="#475569"
          letter-spacing="0.5">e-samba.com</text>

    <!-- ══ SÉPARATEUR VERTICAL ══ -->
    <line x1="580" y1="110" x2="580" y2="520" stroke="#1e3a5f" stroke-width="1" opacity="0.7"/>
    <!-- Dot haut et bas du séparateur -->
    <circle cx="580" cy="110" r="3" fill="#10b981" opacity="0.4"/>
    <circle cx="580" cy="520" r="3" fill="#10b981" opacity="0.4"/>

    <!-- ══ ZONE DROITE : KPI CARDS ══ -->

    <!-- Card 1 : Véhicules actifs -->
    <rect x="614" y="108" width="200" height="108" rx="12"
          fill="url(#card-fill)" stroke="#1e3a5f" stroke-width="1"/>
    <!-- Trait vert haut card -->
    <rect x="614" y="108" width="200" height="2.5" rx="1.5" fill="url(#green-accent)"/>
    <!-- Icône (cercle + carré stylisé véhicule) -->
    <circle cx="636" cy="132" r="10" fill="#10b981" fill-opacity="0.15"/>
    <rect x="629" y="126" width="14" height="11" rx="2" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <line x1="629" y1="132" x2="643" y2="132" stroke="#10b981" stroke-width="1"/>
    <!-- Valeur -->
    <text x="714" y="168"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="44" font-weight="800" fill="#10b981"
          text-anchor="middle" letter-spacing="-1">250+</text>
    <!-- Label -->
    <text x="714" y="196"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="12.5" font-weight="500" fill="#64748b"
          text-anchor="middle" letter-spacing="0.3">VÉHICULES SUIVIS</text>

    <!-- Card 2 : Alertes traitées -->
    <rect x="830" y="108" width="200" height="108" rx="12"
          fill="url(#card-fill)" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="830" y="108" width="200" height="2.5" rx="1.5" fill="#f59e0b"/>
    <!-- Icône alerte -->
    <circle cx="852" cy="132" r="10" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="852" y="137" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle">!</text>
    <!-- Valeur -->
    <text x="930" y="168"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="44" font-weight="800" fill="#f59e0b"
          text-anchor="middle" letter-spacing="-1">98%</text>
    <!-- Label -->
    <text x="930" y="196"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="12.5" font-weight="500" fill="#64748b"
          text-anchor="middle" letter-spacing="0.3">ALERTES TRAITÉES</text>

    <!-- Card 3 : Conducteurs -->
    <rect x="614" y="234" width="200" height="108" rx="12"
          fill="url(#card-fill)" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="614" y="234" width="200" height="2.5" rx="1.5" fill="#3b82f6"/>
    <!-- Icône conducteur -->
    <circle cx="636" cy="258" r="10" fill="#3b82f6" fill-opacity="0.15"/>
    <circle cx="636" cy="255" r="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M628 267 Q636 263 644 267" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Valeur -->
    <text x="714" y="294"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="44" font-weight="800" fill="#3b82f6"
          text-anchor="middle" letter-spacing="-1">1 200+</text>
    <!-- Label -->
    <text x="714" y="322"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="12.5" font-weight="500" fill="#64748b"
          text-anchor="middle" letter-spacing="0.3">CONDUCTEURS</text>

    <!-- Card 4 : Pays CEMAC -->
    <rect x="830" y="234" width="200" height="108" rx="12"
          fill="url(#card-fill)" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="830" y="234" width="200" height="2.5" rx="1.5" fill="#8b5cf6"/>
    <!-- Icône globe -->
    <circle cx="852" cy="258" r="10" fill="#8b5cf6" fill-opacity="0.15"/>
    <circle cx="852" cy="258" r="6.5" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
    <line x1="845.5" y1="258" x2="858.5" y2="258" stroke="#8b5cf6" stroke-width="1"/>
    <ellipse cx="852" cy="258" rx="3.5" ry="6.5" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <!-- Valeur -->
    <text x="930" y="294"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="44" font-weight="800" fill="#8b5cf6"
          text-anchor="middle" letter-spacing="-1">6</text>
    <!-- Label -->
    <text x="930" y="322"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="12.5" font-weight="500" fill="#64748b"
          text-anchor="middle" letter-spacing="0.3">PAYS CEMAC</text>

    <!-- ══ BANDE TECH DROITE ══ -->
    <rect x="614" y="366" width="416" height="52" rx="10"
          fill="#0d1929" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Stack tech pills -->
    <!-- React -->
    <rect x="630" y="379" width="60" height="24" rx="12" fill="#1e3a5f"/>
    <text x="660" y="395" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">React 18</text>
    <!-- Supabase -->
    <rect x="698" y="379" width="72" height="24" rx="12" fill="#1e3a5f"/>
    <text x="734" y="395" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Supabase</text>
    <!-- TypeScript -->
    <rect x="778" y="379" width="82" height="24" rx="12" fill="#1e3a5f"/>
    <text x="819" y="395" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#93c5fd" text-anchor="middle">TypeScript</text>
    <!-- Expo -->
    <rect x="868" y="379" width="52" height="24" rx="12" fill="#1e3a5f"/>
    <text x="894" y="395" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd" text-anchor="middle">Expo</text>
    <!-- Vercel -->
    <rect x="928" y="379" width="56" height="24" rx="12" fill="#1e3a5f"/>
    <text x="956" y="395" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Vercel</text>

    <!-- ══ BLOC MOBILE MONEY ══ -->
    <rect x="614" y="434" width="200" height="52" rx="10"
          fill="#052e16" stroke="#065f46" stroke-width="1"/>
    <!-- Orange Money -->
    <circle cx="638" cy="452" r="8" fill="#ff6600" fill-opacity="0.9"/>
    <text x="638" y="456.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" fill="white" text-anchor="middle">OM</text>
    <text x="654" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#6ee7b7">Orange Money</text>
    <!-- MTN -->
    <circle cx="638" cy="472" r="8" fill="#ffcc00" fill-opacity="0.9"/>
    <text x="638" y="476.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" fill="#333" text-anchor="middle">MM</text>
    <text x="654" y="472" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#6ee7b7">MTN MoMo</text>

    <!-- ══ BLOC B2B BADGE ══ -->
    <rect x="830" y="434" width="200" height="52" rx="10"
          fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="830" y="434" width="200" height="2.5" rx="1.5" fill="url(#green-accent)"/>
    <text x="930" y="458" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">SaaS B2B · Gestion de flotte</text>
    <text x="930" y="476" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Temps réel · WhatsApp · IA prédictive</text>

    <!-- ══ LIGNE BAS ══ -->
    <rect x="0" y="596" width="1200" height="34" fill="#060d1a" opacity="0.85"/>
    <!-- Séparateur haut -->
    <line x1="0" y1="596" x2="1200" y2="596" stroke="#1e3a5f" stroke-width="0.75"/>
    <!-- Texte de bas de page -->
    <text x="64" y="618" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" letter-spacing="0.3">
      La gestion de flotte la plus aboutie d'Afrique Centrale
    </text>
    <!-- URL droite -->
    <text x="1136" y="618" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#10b981" text-anchor="end" letter-spacing="0.3">
      e-samba.com
    </text>
    <!-- Point séparateur -->
    <circle cx="1142" cy="614" r="2.5" fill="#10b981" opacity="0.6"/>

  </g>
</svg>
