# Diagnostic headless : console / pageerror / requêtes (Playwright).
# Déclenchement manuel uniquement (évite échecs réseau aléatoires sur chaque push).

name: Diagnostic console e-samba

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs à tester (séparées par des virgules). Défaut : www en production."
        required: false
        default: "https://www.e-samba.com/"
      verbose:
        description: "1 = lister tous les types de messages console (log, warning, etc.)"
        required: false
        default: "0"

defaults:
  run:
    shell: bash

jobs:
  select-runner:
    name: Select CI runner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on }}
    steps:
      - name: Prefer online Windows self-hosted runner
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const preferredLabels = ["self-hosted", "Windows", "X64"];
            let selected = "ubuntu-latest";
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const hasPreferredRunner = data.runners.some((runner) =>
                runner.status === "online" &&
                preferredLabels.every((label) =>
                  runner.labels.some((runnerLabel) =>
                    runnerLabel.name.toLowerCase() === label.toLowerCase(),
                  ),
                ),
              );
              if (hasPreferredRunner) selected = preferredLabels;
            } catch (error) {
              core.warning(`Unable to inspect self-hosted runners, falling back to ubuntu-latest: ${error.message}`);
            }
            core.setOutput("runs-on", JSON.stringify(selected));
            core.info(`Selected runner: ${Array.isArray(selected) ? selected.join(", ") : selected}`);
  diagnostic-console:
    name: Playwright — console / pageerror
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run diagnostic
        env:
          E_SAMBA_DIAGNOSTIC_URLS: ${{ inputs.urls }}
          E_SAMBA_DIAGNOSTIC_VERBOSE: ${{ inputs.verbose }}
        run: npm run diagnostic:e-samba
