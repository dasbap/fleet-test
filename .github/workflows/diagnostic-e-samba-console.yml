# Diagnostic headless : console / pageerror / requêtes (Playwright).
# Déclenchement manuel uniquement (évite échecs réseau aléatoires sur chaque push).

name: Diagnostic console e-samba

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs à tester (séparées par des virgules). Défaut : www en production."
        required: false
        default: "https://www.e-samba.com/"
      verbose:
        description: "1 = lister tous les types de messages console (log, warning, etc.)"
        required: false
        default: "0"

defaults:
  run:
    shell: bash

jobs:
  diagnostic-console:
    name: Playwright — console / pageerror
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run diagnostic
        env:
          E_SAMBA_DIAGNOSTIC_URLS: ${{ inputs.urls }}
          E_SAMBA_DIAGNOSTIC_VERBOSE: ${{ inputs.verbose }}
        run: npm run diagnostic:e-samba
