name: Supabase Apply Migrations

on:
  push:
    branches: [main, master, PRINCIPALE, admin-panel]
    paths:
      - "supabase/migrations/**"
      - "supabase/baseline/**"
      - "supabase/tests/04_post_migration_objects.sql"
      - "scripts/apply-sql-file.mjs"
      - "scripts/select-supabase-migrations.mjs"
      - ".github/workflows/supabase-apply-migrations.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run liste les migrations, apply les execute sur la BDD cible"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      migration_set:
        description: "runtime = migrations de restauration prod, all = toutes les migrations SQL"
        required: true
        default: runtime
        type: choice
        options:
          - runtime
          - all

permissions:
  contents: read

concurrency:
  group: supabase-apply-migrations-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  apply-migrations:
    name: Apply migrations to Supabase
    runs-on: [self-hosted, Linux, X64]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Install SQL runner dependencies
        timeout-minutes: 8
        run: |
          mkdir -p .ci-sql-runner
          npm --prefix .ci-sql-runner install --ignore-scripts --no-package-lock --no-audit --no-fund pg@8.18.0

      - name: Select migration files
        env:
          MIGRATION_SET: ${{ inputs.migration_set || 'runtime' }}
        run: node scripts/select-supabase-migrations.mjs "$MIGRATION_SET" migration-files.txt

      - name: Print selected migrations
        run: cat migration-files.txt

      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: |
          echo "Dry run uniquement: aucune requete SQL n'a ete executee."
          echo "Relancer cette action avec mode=apply pour appliquer cette liste."

      - name: Apply selected migrations
        if: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SQL_RUNNER_PG_MODULE: .ci-sql-runner/node_modules/pg/lib/index.js
          SKIP_DIRECT_DATA_MUTATIONS: "1"
        run: |
          set -euo pipefail
          db_url="$(node scripts/resolve-supabase-db-url.mjs)"
          echo "::add-mask::$db_url"
          export DATABASE_URL="$db_url"
          export DIRECT_URL=""
          export SUPABASE_DB_URL=""
          export PGSSLMODE="no-verify"

          mapfile -t migration_files < migration-files.txt
          if [ "${#migration_files[@]}" -eq 0 ]; then
            echo "::error::Aucune migration selectionnee."
            exit 1
          fi
          node scripts/apply-sql-file.mjs "${migration_files[@]}"

      - name: Verify critical migration objects
        if: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SQL_RUNNER_PG_MODULE: .ci-sql-runner/node_modules/pg/lib/index.js
        run: |
          set -euo pipefail
          db_url="$(node scripts/resolve-supabase-db-url.mjs)"
          echo "::add-mask::$db_url"
          export DATABASE_URL="$db_url"
          export DIRECT_URL=""
          export SUPABASE_DB_URL=""
          export PGSSLMODE="no-verify"
          node scripts/apply-sql-file.mjs supabase/tests/04_post_migration_objects.sql
