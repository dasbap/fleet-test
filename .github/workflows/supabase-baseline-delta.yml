name: Supabase Baseline and Delta Validation

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/test-baseline-delta.ps1"
      - "scripts/test-sql-security.ps1"
      - "scripts/freeze-remote-schema.ps1"
      - "package.json"
  push:
    branches:
      - main
      - master
    paths:
      - "supabase/**"
      - "scripts/test-baseline-delta.ps1"
      - "scripts/test-sql-security.ps1"
      - "scripts/freeze-remote-schema.ps1"
      - "package.json"
  workflow_dispatch:

jobs:
  validate-baseline-delta:
    name: Validate baseline + deltas on fresh local DB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare CI log directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "supabase-ci-logs" -Force | Out-Null

      - name: Run baseline + delta validation
        shell: pwsh
        env:
          CI_SUPABASE_DEBUG: "true"
        run: ./scripts/test-baseline-delta.ps1 *>&1 | Tee-Object -FilePath "supabase-ci-logs/baseline-delta.log"

      - name: Run SQL security tests
        shell: pwsh
        env:
          CI_SUPABASE_DEBUG: "true"
        run: ./scripts/test-sql-security.ps1 *>&1 | Tee-Object -FilePath "supabase-ci-logs/sql-security.log"

      - name: Upload Supabase debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-debug-logs
          path: supabase-ci-logs/
          if-no-files-found: warn

  validate-delta-file-list:
    name: Validate delta files exist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate delta migration list
        run: |
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            if [ ! -f "$file" ]; then
              echo "Missing delta file: $file"
              exit 1
            fi
          done < supabase/baseline/delta-migrations.txt
