name: Supabase Baseline and Delta Validation

on:
  pull_request:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  push:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SUPABASE_CLI_VERSION: "2.109.1"

defaults:
  run:
    shell: bash

jobs:
  validate-baseline-delta:
    name: Validate baseline + deltas on fresh local DB
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI Installation
        run: |
          supabase --version

      - name: Prepare CI Log Directory
        run: mkdir -p supabase-ci-logs

      - name: Run Baseline + Delta Validation
        env:
          CI_SUPABASE_DEBUG: "false"
        run: npm run test:baseline-delta:node -- --target local 2>&1 | tee supabase-ci-logs/baseline-delta.log

      - name: Run SQL Security Tests
        run: npm run test:sql-security:node -- --target local 2>&1 | tee supabase-ci-logs/sql-security.log

      - name: Upload Supabase Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-debug-logs
          path: supabase-ci-logs/
          if-no-files-found: warn

  validate-delta-file-list:
    name: Validate delta files exist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Validate Delta Migration List
        run: |
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            if [ ! -f "$file" ]; then
              echo "Missing delta file: $file"
              exit 1
            fi
          done < supabase/baseline/delta-migrations.txt
