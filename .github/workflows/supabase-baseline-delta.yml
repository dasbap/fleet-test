name: Supabase Baseline and Delta Validation

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/test-baseline-delta.ps1"
      - "scripts/test-sql-security.ps1"
      - "scripts/freeze-remote-schema.ps1"
      - "package.json"
  push:
    branches:
      - main
      - master
    paths:
      - "supabase/**"
      - "scripts/test-baseline-delta.ps1"
      - "scripts/test-sql-security.ps1"
      - "scripts/freeze-remote-schema.ps1"
      - "package.json"
  workflow_dispatch:

jobs:
  validate-baseline-delta:
    name: Validate baseline + deltas on fresh local DB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Run baseline + delta validation
        shell: pwsh
        run: ./scripts/test-baseline-delta.ps1

      - name: Run SQL security tests
        shell: pwsh
        run: ./scripts/test-sql-security.ps1

  validate-delta-file-list:
    name: Validate delta files exist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate delta migration list
        run: |
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            if [ ! -f "$file" ]; then
              echo "Missing delta file: $file"
              exit 1
            fi
          done < supabase/baseline/delta-migrations.txt
