# Lighthouse est coûteux (Chrome + build + plusieurs audits).
# Il reste disponible à la demande, mais ne consomme plus de minutes sur chaque PR/push.
name: Lighthouse CI — garde-fou

on:
  workflow_dispatch:

concurrency:
  group: lighthouse-guard-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lighthouse:
    name: Lighthouse CI (placeholders)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://placeholder-build.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Check critical bundle budget
        run: npm run check:bundle-budget:critical
      - name: Start preview
        run: npm run preview &
      - name: Wait for preview
        run: npx wait-on http://localhost:4173 --timeout 60000
      - name: Setup Chrome 124
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: "124"
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=.github/lighthouse/lighthouserc.json
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Run critical Lighthouse CI
        run: npx lhci autorun --config=.github/lighthouse/lighthouserc.critical.json
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Run INP interaction audit
        run: node scripts/check-inp-interactions.mjs
        env:
          PERF_BASE_URL: http://127.0.0.1:4173
          INP_MAX_MS: 200
