# Garde-fou Lighthouse sans secrets GitHub (VITE_* factices, forks OK).
# Audite les mêmes URLs que lighthouserc après preview sur le port 4173.
#
# Pour un audit complet (secrets réels, budget JS, commentaire PR, treosh) :
# voir .github/workflows/lighthouse.yml
#
# Politique assertions (JSON strict dans lighthouserc — pas de // dans le fichier ; détails ici).
# Voir aussi scripts/lighthouse-ci-local.mjs.
# Blocage CI (failOnSeverity par défaut = error) : CLS médiane ≤ 0,1 uniquement.
# Avertissements (warn, n’échouent pas le job) : scores perf/a11y, LCP, INP, FCP, SI, TBT,
# audits opportunités (maxLength > 0 pour éviter zéro tolérance), unused JS/CSS (seuils bytes généreux).
# SEO : seconde passe lighthouserc-seo.json sur / uniquement (voir .github/lighthouse/README.md).
# Profil strict (perf+LCP en error) : lighthouserc.strict.json — npm run lighthouse:ci:strict ; CI sur demande.
#
# Doublon possible : un push sur main (etc.) qui modifie p.ex. src/** peut lancer ce workflow
# et lighthouse.yml en parallèle (intention : garde-fou sans secrets vs audit complet). Pour
# n’en garder qu’un, désactiver l’un des deux sur certaines branches ou via conditions — non imposé ici.
name: Lighthouse CI — garde-fou

on:
  push:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  pull_request:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  workflow_dispatch:

concurrency:
  group: heavy-ci
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Lighthouse changes
    runs-on: [self-hosted, Linux, X64]
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
          fetch-depth: 0

      - id: filter
        name: Check changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          if echo "$changed" | grep -Eq '^(src/|index\.html$|vite\.config\.ts$|package(-lock)?\.json$|\.github/lighthouse/|\.github/workflows/lighthouse-ci\.yml$|scripts/check-inp-interactions\.mjs$|scripts/check-.*bundle.*\.mjs$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  lighthouse:
    name: Lighthouse CI (placeholders)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://placeholder-build.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      - name: Vérifier budget JS initial (routes critiques)
        run: npm run check:bundle-budget:critical

      - name: Démarrer le serveur preview
        run: npm run preview &

      - name: Attendre le serveur
        run: npx wait-on http://localhost:4173 --timeout 60000

      - name: Setup Chrome 124 (compatible Lighthouse 11)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: "124"

      - name: Run Lighthouse CI (perf, a11y)
        run: npx lhci autorun --config=.github/lighthouse/lighthouserc.json
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Run Lighthouse CI (critical routes only)
        run: npx lhci autorun --config=.github/lighthouse/lighthouserc.critical.json
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Run INP interaction audit
        run: node scripts/check-inp-interactions.mjs
        env:
          PERF_BASE_URL: http://127.0.0.1:4173
          INP_MAX_MS: 200

      - name: Run Lighthouse CI (SEO — page d’accueil)
        run: npx lhci autorun --config=.github/lighthouse/lighthouserc-seo.json
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
