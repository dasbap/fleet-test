name: Provision one-shot test organizer

on:
  push:
    paths:
      - .github/workflows/provision-test-user-once.yml

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_URL: https://www.e-samba.com
      TEST_EMAIL: chatgpt-provision-test-20260831-1530@e-samba.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/ci-install.mjs
      - name: Provision organizer
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto'
          import { createClient } from '@supabase/supabase-js'

          const url = process.env.SUPABASE_URL
          const anonKey = process.env.SUPABASE_ANON_KEY
          const serviceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY
          const email = process.env.TEST_EMAIL
          const appUrl = process.env.APP_URL

          if (!url || !anonKey || !serviceRoleKey || !email || !appUrl) {
            throw new Error('missing_environment')
          }

          const admin = createClient(url, serviceRoleKey, {
            auth: { persistSession: false, autoRefreshToken: false },
          })

          const password = randomBytes(18).toString('base64url')
          const issuedAt = new Date().toISOString()

          const { data: created, error: createError } = await admin.auth.admin.createUser({
            email,
            password,
            email_confirm: true,
            app_metadata: {
              must_set_password: true,
              temporary_password_active: true,
              temporary_password_issued_at: issuedAt,
            },
            user_metadata: {
              full_name: 'Test Provisioning ChatGPT',
              phone: null,
              created_by_admin: 'github-actions-one-shot',
            },
          })

          if (createError || !created.user) {
            throw new Error(createError?.message || 'auth_create_failed')
          }

          const userId = created.user.id

          try {
            const { error: profileError } = await admin.from('profils').upsert(
              {
                user_id: userId,
                full_name: 'Test Provisioning ChatGPT',
                phone: null,
                created_by: null,
              },
              { onConflict: 'user_id' },
            )

            if (profileError) throw new Error(`profile_create_failed:${profileError.message}`)

            const publicAuth = createClient(url, anonKey, {
              auth: { persistSession: false, autoRefreshToken: false },
            })

            const { error: resetError } = await publicAuth.auth.resetPasswordForEmail(email, {
              redirectTo: `${appUrl.replace(/\/$/, '')}/set-password`,
            })

            if (resetError) throw new Error(`password_setup_email_failed:${resetError.message}`)

            console.log(JSON.stringify({ ok: true, user_id: userId, email, role: 'organizer' }))
          } catch (error) {
            await admin.auth.admin.deleteUser(userId)
            throw error
          }
          NODE
