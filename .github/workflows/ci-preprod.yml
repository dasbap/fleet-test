name: CI Pre-prod

on:
  pull_request:
    branches:
      - pre-prod
  push:
    branches:
      - pre-prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-preprod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  db-migrations:
    name: Supabase migrations (fresh DB)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Prepare dynamic Supabase local ports
        run: node scripts/prepare-local-supabase-ports.mjs
      - name: Start Supabase local
        run: supabase start -x vector,logflare
      - name: Replay all migrations
        run: supabase db reset --no-seed
      - name: Supabase status
        if: always()
        run: supabase status || true
      - name: Stop Supabase local
        if: always()
        run: supabase stop --no-backup || true

  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs
      - name: Run ESLint
        run: npm run lint

  tests:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs
      - name: Run unit tests
        run: npx vitest run --exclude "tests/integration/**" --exclude "tests/e2e/**"
