name: Supabase Integration Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tests/integration/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.integration.config.ts"
      - ".github/workflows/supabase-integration-tests.yml"

  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tests/integration/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.integration.config.ts"
      - ".github/workflows/supabase-integration-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  supabase-integration:
    name: Supabase local integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          if ! command -v unzip >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y unzip curl ca-certificates
              else
                apt-get update
                apt-get install -y unzip curl ca-certificates
              fi
            else
              echo "::error::unzip est requis sur ce runner"
              exit 1
            fi
          fi

          command -v unzip
          command -v curl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: TypeScript check
        run: npx tsc --noEmit
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_key

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Prepare dynamic Supabase local ports
        run: node scripts/prepare-local-supabase-ports.mjs

      - name: Start Supabase local
        run: supabase start -x vector,logflare

      - name: Reset local database
        run: supabase db reset --no-seed

      - name: Create isolated local test environment
        run: |
          status_file="/tmp/supabase-status.env"
          test_file="/tmp/supabase-integration.env"

          supabase status -o env > "$status_file"

          unset VITE_SUPABASE_URL
          unset VITE_SUPABASE_ANON_KEY
          unset SUPABASE_SERVICE_ROLE_KEY
          unset SUPABASE_URL
          unset SUPABASE_ANON_KEY

          set -a
          source "$status_file"
          set +a

          test -n "${API_URL:-}" || {
            echo "::error::API_URL absente de supabase status"
            exit 1
          }

          test -n "${ANON_KEY:-}" || {
            echo "::error::ANON_KEY absente de supabase status"
            exit 1
          }

          test -n "${SERVICE_ROLE_KEY:-}" || {
            echo "::error::SERVICE_ROLE_KEY absente de supabase status"
            exit 1
          }

          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*)
              ;;
            *)
              echo "::error::URL Supabase non locale : $API_URL"
              exit 1
              ;;
          esac

          API_URL="$API_URL" \
          ANON_KEY="$ANON_KEY" \
          SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node <<'NODE'
          const decode = (part) =>
            JSON.parse(
              Buffer.from(part, "base64url").toString("utf8"),
            )

          const validate = (name, token, expectedRole) => {
            const parts = token.split(".")

            if (parts.length !== 3) {
              throw new Error(`${name} n'est pas un JWT valide`)
            }

            const header = decode(parts[0])
            const payload = decode(parts[1])

            if (header.alg !== "HS256") {
              throw new Error(
                `${name} utilise ${header.alg}; HS256 attendu pour Supabase local`,
              )
            }

            if (payload.role !== expectedRole) {
              throw new Error(
                `${name} contient le rôle ${payload.role ?? "absent"}; ${expectedRole} attendu`,
              )
            }
          }

          validate(
            "ANON_KEY",
            process.env.ANON_KEY,
            "anon",
          )

          validate(
            "SERVICE_ROLE_KEY",
            process.env.SERVICE_ROLE_KEY,
            "service_role",
          )

          console.log("Identifiants Supabase locaux valides")
          NODE

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"

          {
            printf 'VITE_SUPABASE_URL=%q\n' "$API_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%q\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%q\n' "$SERVICE_ROLE_KEY"
          } > "$test_file"

          chmod 600 "$test_file"

      - name: Run integration tests
        run: |
          unset VITE_SUPABASE_URL
          unset VITE_SUPABASE_ANON_KEY
          unset SUPABASE_SERVICE_ROLE_KEY
          unset SUPABASE_URL
          unset SUPABASE_ANON_KEY

          set -a
          source /tmp/supabase-integration.env
          set +a

          case "$VITE_SUPABASE_URL" in
            http://127.0.0.1:*|http://localhost:*)
              ;;
            *)
              echo "::error::Les tests ne ciblent pas Supabase local"
              exit 1
              ;;
          esac

          algorithm="$(
            node -e "
              const token = process.env.SUPABASE_SERVICE_ROLE_KEY;
              const header = JSON.parse(
                Buffer.from(
                  token.split('.')[0],
                  'base64url'
                ).toString('utf8')
              );
              process.stdout.write(header.alg || '');
            "
          )"

          if [ "$algorithm" != "HS256" ]; then
            echo "::error::Clé service_role invalide : $algorithm"
            exit 1
          fi

          mkdir -p test-results

          npx vitest run \
            --config vitest.integration.config.ts \
            tests/integration/rls.fleet-access.test.ts \
            tests/integration/triggers.vehicle-limit.test.ts \
            tests/integration/fuel.fraud-scoring.test.ts \
            --reporter=default \
            --reporter=json \
            --outputFile=test-results/supabase-integration.json

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-integration-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Supabase status
        if: always()
        run: supabase status || true

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f \
            /tmp/supabase-status.env \
            /tmp/supabase-integration.env

      - name: Stop Supabase local
        if: always()
        run: supabase stop --no-backup || true
