name: Supabase Integration Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tests/integration/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.integration.config.ts"
      - ".github/workflows/supabase-integration-tests.yml"

  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tests/integration/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.integration.config.ts"
      - ".github/workflows/supabase-integration-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  supabase-integration:
    name: Supabase local integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          if command -v unzip >/dev/null 2>&1; then
            unzip -v | head -n 1
            exit 0
          fi

          if command -v apt-get >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y unzip curl ca-certificates
            else
              apt-get update
              apt-get install -y unzip curl ca-certificates
            fi
          else
            echo "::error::apt-get indisponible. Installez unzip sur le runner."
            exit 1
          fi

          command -v unzip >/dev/null 2>&1 || {
            echo "::error::unzip reste indisponible après installation"
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: TypeScript
        run: npx tsc --noEmit
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_key

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Prepare dynamic Supabase local ports
        run: node scripts/prepare-local-supabase-ports.mjs

      - name: Start Supabase local
        run: supabase start --ignore-health-check

      - name: Apply migrations
        run: supabase db push --local

      - name: Export local Supabase credentials
        run: |
          supabase status -o env > /tmp/supabase-status.env

          set -a
          source /tmp/supabase-status.env
          set +a

          test -n "${API_URL:-}" || {
            echo "::error::API_URL is missing from Supabase local status"
            exit 1
          }

          test -n "${ANON_KEY:-}" || {
            echo "::error::ANON_KEY is missing from Supabase local status"
            exit 1
          }

          test -n "${SERVICE_ROLE_KEY:-}" || {
            echo "::error::SERVICE_ROLE_KEY is missing from Supabase local status"
            exit 1
          }

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"

          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Verify local Supabase credentials
        run: |
          test -n "${VITE_SUPABASE_URL:-}" || {
            echo "::error::VITE_SUPABASE_URL is missing"
            exit 1
          }

          test -n "${VITE_SUPABASE_ANON_KEY:-}" || {
            echo "::error::VITE_SUPABASE_ANON_KEY is missing"
            exit 1
          }

          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || {
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          }

          case "$VITE_SUPABASE_URL" in
            http://127.0.0.1:*|http://localhost:*)
              echo "Using local Supabase instance: $VITE_SUPABASE_URL"
              ;;
            *)
              echo "::error::Integration tests must target local Supabase, received: $VITE_SUPABASE_URL"
              exit 1
              ;;
          esac

          node <<'NODE'
          const token = process.env.SUPABASE_SERVICE_ROLE_KEY

          if (!token) {
            throw new Error("SUPABASE_SERVICE_ROLE_KEY manquante")
          }

          const parts = token.split(".")

          if (parts.length !== 3) {
            throw new Error(
              "La clé service_role locale n'est pas un JWT valide",
            )
          }

          const header = JSON.parse(
            Buffer.from(parts[0], "base64url").toString("utf8"),
          )

          const payload = JSON.parse(
            Buffer.from(parts[1], "base64url").toString("utf8"),
          )

          if (payload.role !== "service_role") {
            throw new Error(
              `Rôle JWT incorrect : ${payload.role ?? "absent"}`,
            )
          }

          console.log(
            `Identifiants Supabase locaux valides, algorithme JWT : ${header.alg}`,
          )
          NODE

      - name: Run integration tests
        run: |
          mkdir -p test-results

          npx vitest run \
            --config vitest.integration.config.ts \
            --reporter=default \
            --reporter=json \
            --outputFile=test-results/supabase-integration.json

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-integration-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Supabase status
        if: always()
        run: supabase status || true

      - name: Stop Supabase local
        if: always()
        run: supabase stop --no-backup || true
