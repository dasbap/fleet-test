name: Supabase Integration Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  supabase-integration:
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Start Supabase local
        run: supabase start --ignore-health-check

      - name: Apply migrations
        run: supabase db push --local

      - name: Run integration tests
        run: npx vitest run -c vitest.integration.config.ts

      - name: Supabase status (always)
        if: always()
        run: supabase status

      - name: Stop Supabase local (always)
        if: always()
        run: supabase stop
