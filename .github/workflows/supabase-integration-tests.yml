name: Supabase Integration Tests

on:
  pull_request:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  push:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  supabase-integration:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: TypeScript
        run: npx tsc --noEmit
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Prepare dynamic Supabase local ports
        run: node scripts/prepare-local-supabase-ports.mjs

      - name: Start Supabase local
        run: supabase start --ignore-health-check

      - name: Apply migrations
        run: supabase db push --local

      - name: Run integration tests
        run: npx vitest run -c vitest.integration.config.ts

      - name: Supabase status (always)
        if: always()
        run: supabase status

      - name: Stop Supabase local (always)
        if: always()
        run: supabase stop
