name: Supabase Integration Tests

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  select-runner:
    name: Select CI runner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on }}
    steps:
      - name: Prefer online Windows self-hosted runner
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const preferredLabels = ["self-hosted", "Windows", "X64"];
            let selected = "ubuntu-latest";
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const hasPreferredRunner = data.runners.some((runner) =>
                runner.status === "online" &&
                preferredLabels.every((label) =>
                  runner.labels.some((runnerLabel) =>
                    runnerLabel.name.toLowerCase() === label.toLowerCase(),
                  ),
                ),
              );
              if (hasPreferredRunner) selected = preferredLabels;
            } catch (error) {
              core.warning(`Unable to inspect self-hosted runners, falling back to ubuntu-latest: ${error.message}`);
            }
            core.setOutput("runs-on", JSON.stringify(selected));
            core.info(`Selected runner: ${Array.isArray(selected) ? selected.join(", ") : selected}`);
  supabase-integration:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Start Supabase local
        run: supabase start --ignore-health-check

      - name: Apply migrations
        run: supabase db push --local

      - name: Run integration tests
        run: npx vitest run -c vitest.integration.config.ts

      - name: Supabase status (always)
        if: always()
        run: supabase status

      - name: Stop Supabase local (always)
        if: always()
        run: supabase stop
