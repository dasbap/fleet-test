# Vérifie que le bundle WebView Capacitor compile (chemins relatifs, pas de régression Vite).
name: Build Capacitor

on:
  push:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  pull_request:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  workflow_dispatch:

concurrency:
  group: heavy-ci
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Capacitor changes
    runs-on: [self-hosted, Linux, X64]
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
          fetch-depth: 0

      - id: filter
        name: Check changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          if echo "$changed" | grep -Eq '^(src/|android/|resources/|vite\.config\.ts$|package(-lock)?\.json$|index\.html$|capacitor\.config\.ts$|scripts/export-resources-icon-png\.mjs$|\.github/workflows/build-capacitor\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build-capacitor:
    name: vite build (mode capacitor)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: [self-hosted, Linux, X64]
    env:
      # Valeurs factices : le client Supabase n’est pas exécuté pendant le build statique.
      VITE_SUPABASE_URL: https://placeholder-build.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: Guardrail - no critical Vite externals
        run: npm run check:vite-external

      - name: Build (capacitor mode)
        run: npm run build:capacitor

      - name: Vérifier dist/ (artefacts minimaux)
        run: npm run verify:dist

      - name: Capacitor sync
        run: npm run cap:sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Android assembleDebug
        working-directory: android
        shell: bash
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
          if [ -f ./gradlew ]; then ./gradlew :app:assembleDebug --no-daemon
          elif [ -f ./gradlew.bat ]; then ./gradlew.bat :app:assembleDebug --no-daemon
          else echo "gradlew introuvable" && exit 1
          fi
