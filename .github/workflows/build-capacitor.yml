# Vérifie que le bundle WebView Capacitor compile (chemins relatifs, pas de régression Vite).
name: Build Capacitor

on:
  push:
    branches:
      - main
      - master
      - release/**
    paths:
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "capacitor.config.ts"
      - "android/**"
      - "resources/**"
      - "scripts/export-resources-icon-png.mjs"
  pull_request:
    branches:
      - main
      - master
      - release/**
    paths:
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "capacitor.config.ts"
      - "android/**"
      - "resources/**"
      - "scripts/export-resources-icon-png.mjs"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  select-runner:
    name: Select CI runner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on }}
    steps:
      - name: Prefer online Windows self-hosted runner
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const preferredLabels = ["self-hosted", "Windows", "X64"];
            let selected = "ubuntu-latest";
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const hasPreferredRunner = data.runners.some((runner) =>
                runner.status === "online" &&
                preferredLabels.every((label) =>
                  runner.labels.some((runnerLabel) =>
                    runnerLabel.name.toLowerCase() === label.toLowerCase(),
                  ),
                ),
              );
              if (hasPreferredRunner) selected = preferredLabels;
            } catch (error) {
              core.warning(`Unable to inspect self-hosted runners, falling back to ubuntu-latest: ${error.message}`);
            }
            core.setOutput("runs-on", JSON.stringify(selected));
            core.info(`Selected runner: ${Array.isArray(selected) ? selected.join(", ") : selected}`);
  build-capacitor:
    name: vite build (mode capacitor)
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    env:
      # Valeurs factices : le client Supabase n’est pas exécuté pendant le build statique.
      VITE_SUPABASE_URL: https://placeholder-build.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install libvips (requis par @capacitor/assets/sharp en fallback compilation)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Install dependencies
        run: npm ci

      - name: Guardrail - no critical Vite externals
        run: npm run check:vite-external

      - name: Build (capacitor mode)
        run: npm run build:capacitor

      - name: Vérifier dist/ (artefacts minimaux)
        run: npm run verify:dist

      - name: Capacitor sync
        run: npm run cap:sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Android assembleDebug
        working-directory: android
        shell: bash
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
          if [ -f ./gradlew ]; then ./gradlew :app:assembleDebug --no-daemon
          elif [ -f ./gradlew.bat ]; then ./gradlew.bat :app:assembleDebug --no-daemon
          else echo "gradlew introuvable" && exit 1
          fi
