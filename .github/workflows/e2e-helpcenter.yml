name: E2E HelpCenter i18n

on:
  pull_request:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect HelpCenter changes
    runs-on: [self-hosted, Linux, X64]
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Check changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          if echo "$changed" | grep -Eq '^(tests/e2e/|src/components/shared/HelpCenter\.tsx$|src/context/HelpContext\.tsx$|public/locales/|package(-lock)?\.json$|\.github/workflows/e2e-helpcenter\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-helpcenter:
    name: Playwright HelpCenter (fr/en/ln)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valeurs factices : le client Supabase s'initialise sans planter (URL valide requise),
      # mais l'app tourne en mode mock-auth (esamba-demo-auth-fallback=true côté test).
      # Les seuls appels réseau Supabase (billing RPC) sont interceptés par Playwright.
      VITE_SUPABASE_URL: https://placeholder-e2e.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-e2e-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: Install Playwright (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run HelpCenter i18n E2E
        env:
          VITE_USE_MOCK_AUTH: "true"
          # Variables minimales pour initialiser le client Supabase côté front en CI
          # (les appels réseau sont mockés dans ce scénario E2E).
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock.payload.signature"
        run: npm run test:e2e:help

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-helpcenter
          path: playwright-report
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-helpcenter
          path: test-results
          retention-days: 7
