name: E2E HelpCenter i18n

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - release/**
    paths:
      - "tests/e2e/**"
      - "src/components/shared/HelpCenter.tsx"
      - "src/context/HelpContext.tsx"
      - "public/locales/**"
      - "package.json"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  select-runner:
    name: Select CI runner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on }}
    steps:
      - name: Prefer online Windows self-hosted runner
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const preferredLabels = ["self-hosted", "Windows", "X64"];
            let selected = "ubuntu-latest";
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const hasPreferredRunner = data.runners.some((runner) =>
                runner.status === "online" &&
                preferredLabels.every((label) =>
                  runner.labels.some((runnerLabel) =>
                    runnerLabel.name.toLowerCase() === label.toLowerCase(),
                  ),
                ),
              );
              if (hasPreferredRunner) selected = preferredLabels;
            } catch (error) {
              core.warning(`Unable to inspect self-hosted runners, falling back to ubuntu-latest: ${error.message}`);
            }
            core.setOutput("runs-on", JSON.stringify(selected));
            core.info(`Selected runner: ${Array.isArray(selected) ? selected.join(", ") : selected}`);
  e2e-helpcenter:
    name: Playwright HelpCenter (fr/en/ln)
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 20
    env:
      # Valeurs factices : le client Supabase s'initialise sans planter (URL valide requise),
      # mais l'app tourne en mode mock-auth (esamba-demo-auth-fallback=true côté test).
      # Les seuls appels réseau Supabase (billing RPC) sont interceptés par Playwright.
      VITE_SUPABASE_URL: https://placeholder-e2e.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-e2e-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run HelpCenter i18n E2E
        env:
          VITE_USE_MOCK_AUTH: "true"
          # Variables minimales pour initialiser le client Supabase côté front en CI
          # (les appels réseau sont mockés dans ce scénario E2E).
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock.payload.signature"
        run: npm run test:e2e:help

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-helpcenter
          path: playwright-report
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-helpcenter
          path: test-results
          retention-days: 7
