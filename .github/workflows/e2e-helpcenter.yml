name: E2E HelpCenter i18n

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - release/**
    paths:
      - "tests/e2e/**"
      - "src/components/shared/HelpCenter.tsx"
      - "src/context/HelpContext.tsx"
      - "public/locales/**"
      - "package.json"
  workflow_dispatch:

jobs:
  e2e-helpcenter:
    name: Playwright HelpCenter (fr/en/ln)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run HelpCenter i18n E2E
        env:
          VITE_USE_MOCK_AUTH: "true"
          # Variables minimales pour initialiser le client Supabase côté front en CI
          # (les appels réseau sont mockés dans ce scénario E2E).
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock.payload.signature"
        run: npm run test:e2e:help

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-helpcenter
          path: playwright-report
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-helpcenter
          path: test-results
          retention-days: 7
