name: Image Optimization CI

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - release/**
    paths:
      - "src/assets/**"
      - "resources/**"
      - "store-assets/**"
      - "scripts/optimize-images.mjs"
      - "scripts/image-profiles.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/image-optimization.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  select-runner:
    name: Select CI runner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on }}
    steps:
      - name: Prefer online Windows self-hosted runner
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const preferredLabels = ["self-hosted", "Windows", "X64"];
            let selected = "ubuntu-latest";
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const hasPreferredRunner = data.runners.some((runner) =>
                runner.status === "online" &&
                preferredLabels.every((label) =>
                  runner.labels.some((runnerLabel) =>
                    runnerLabel.name.toLowerCase() === label.toLowerCase(),
                  ),
                ),
              );
              if (hasPreferredRunner) selected = preferredLabels;
            } catch (error) {
              core.warning(`Unable to inspect self-hosted runners, falling back to ubuntu-latest: ${error.message}`);
            }
            core.setOutput("runs-on", JSON.stringify(selected));
            core.info(`Selected runner: ${Array.isArray(selected) ? selected.join(", ") : selected}`);
  optimize-images-strict:
    name: Optimize images strict (prod)
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute strict optimization profile (prod)
        run: npm run optimize:images:strict:prod

      - name: Commentaire PR — dérive de poids images
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const reportPath = "scripts/reports/optimize-images-report.json";
            const marker = "<!-- image-drift-report -->";
            const formatKo = (bytes) => `${(bytes / 1024).toFixed(1)} Ko`;

            let body = `${marker}\n## Rapport dérive poids images\n\n`;
            if (!fs.existsSync(reportPath)) {
              body += "Rapport introuvable (`scripts/reports/optimize-images-report.json`).";
            } else {
              const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
              const summary = report.summary || {};
              const envName = report.environment || "n/a";
              const alerts = Array.isArray(report.monitoringAlerts) ? report.monitoringAlerts : [];

              body += `- Environnement: \`${envName}\`\n`;
              body += `- Fichiers traités: **${summary.files ?? 0}**\n`;
              body += `- Gain total: **${formatKo(summary.gainBytes ?? 0)}**\n`;
              body += `- Hors budget: **${summary.outOfBudget ?? 0}**\n`;
              body += `- Alertes dérive: **${alerts.length}**\n\n`;

              if (alerts.length === 0) {
                body += "Aucune dérive de poids détectée au-dessus des seuils.\n";
              } else {
                body += "| Fichier | Delta Ko | Delta % |\n|---|---:|---:|\n";
                for (const alert of alerts) {
                  body += `| \`${alert.file}\` | +${Number(alert.growthKb).toFixed(1)} | +${Number(alert.growthPercent).toFixed(1)}% |\n`;
                }
              }
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === "Bot" && typeof c.body === "string" && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload optimization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimize-images-report
          path: scripts/reports/optimize-images-report.json
          if-no-files-found: warn
