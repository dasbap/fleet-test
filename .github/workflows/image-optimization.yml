name: Image Optimization CI

on:
  pull_request:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
          fetch-depth: 0

      - id: filter
        name: Check changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"

          if echo "$changed" | grep -Eq '^(src/assets/|resources/|store-assets/|scripts/optimize-images\.mjs$|scripts/image-profiles\.json$|package(-lock)?\.json$|\.github/workflows/image-optimization\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  optimize-images-strict:
    name: Optimize images strict (prod)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: Execute strict optimization profile (prod)
        run: npm run optimize:images:strict:prod

      - name: Commentaire PR — dérive de poids images
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 4
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const fs = require("fs");
            const reportPath = "scripts/reports/optimize-images-report.json";
            const marker = "<!-- image-drift-report -->";
            const formatKo = (bytes) => `${(bytes / 1024).toFixed(1)} Ko`;

            let body = `${marker}\n## Rapport dérive poids images\n\n`;

            if (!fs.existsSync(reportPath)) {
              body += "Rapport introuvable (`scripts/reports/optimize-images-report.json`).";
            } else {
              const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
              const summary = report.summary || {};
              const envName = report.environment || "n/a";
              const alerts = Array.isArray(report.monitoringAlerts)
                ? report.monitoringAlerts
                : [];

              body += `- Environnement: \`${envName}\`\n`;
              body += `- Fichiers traités: **${summary.files ?? 0}**\n`;
              body += `- Gain total: **${formatKo(summary.gainBytes ?? 0)}**\n`;
              body += `- Hors budget: **${summary.outOfBudget ?? 0}**\n`;
              body += `- Alertes dérive: **${alerts.length}**\n\n`;

              if (alerts.length === 0) {
                body += "Aucune dérive de poids détectée au-dessus des seuils.\n";
              } else {
                body += "| Fichier | Delta Ko | Delta % |\n|---|---:|---:|\n";

                for (const alert of alerts) {
                  body += `| \`${alert.file}\` | +${Number(alert.growthKb).toFixed(1)} | +${Number(alert.growthPercent).toFixed(1)}% |\n`;
                }
              }
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100,
              }
            );

            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                typeof comment.body === "string" &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload optimization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimize-images-report
          path: scripts/reports/optimize-images-report.json
          if-no-files-found: warn
