name: Lighthouse CI — audit complet

on:
  workflow_dispatch:

concurrency:
  group: lighthouse-full-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lighthouse:
    name: Core Web Vitals audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key-ci-lighthouse' }}
      - name: Check JS bundle budget
        run: npm run check:bundle-budget
      - name: Start preview
        run: npm run preview &
      - name: Wait for preview
        run: npx wait-on http://localhost:4173 --timeout 60000
      - name: Setup Chrome 124
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: "124"
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 2
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Lighthouse SEO
        run: npx lhci autorun --config=.github/lighthouse/lighthouserc-seo.json
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
