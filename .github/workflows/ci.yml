name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1 : Migrations et tests DB
  db-migrations:
    name: Supabase migrations (fresh DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local
        run: supabase start --ignore-health-check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply all migrations
        run: supabase db push --local
        continue-on-error: false

      - name: Smoke test - search_fleet sans auth
        run: |
          RESULT=$(supabase db query "SELECT count(*) AS result FROM public.search_fleet('Toyota', 5, NULL);" --local | tr -d '\r')
          echo "$RESULT"
          echo "$RESULT" | grep -Eq '(^|[^0-9])0([^0-9]|$)' \
            && echo "CI safe: 0 rows without auth" \
            || (echo "search_fleet a retourne des lignes sans auth ou a plante" && exit 1)

      - name: Smoke test - retention views
        run: |
          supabase db query \
            "SELECT table_name FROM information_schema.views WHERE table_schema='public' AND table_name LIKE 'v_retention%' ORDER BY table_name;" \
            --local

      - name: Stop Supabase local
        if: always()
        run: supabase stop

  # Job 2 : Build TypeScript
  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    needs: db-migrations

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Bundle size check
        run: |
          TOTAL=$(find dist/assets -name "*.js" -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo 0)
          KB=$((TOTAL / 1024))
          echo "Bundle JS : ${KB} KB"
          if [ "$KB" -gt 300 ]; then
            echo "::warning::Bundle ${KB}KB depasse 300KB - verifier les imports"
          fi

  # Job 3 : Lint
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
        continue-on-error: false
