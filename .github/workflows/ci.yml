name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - PRINCIPALE
      - fix/ci-green-main
      - "release/**"
  pull_request:
    branches:
      - main
      - master
      - develop
      - PRINCIPALE
      - fix/ci-green-main
      - "release/**"
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the heavier local Supabase validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=2048

defaults:
  run:
    shell: bash

jobs:
  pr-gate:
    name: Main PR gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm staged validation policy
        run: |
          echo "Heavy validation is performed on pull requests into pre-prod."
          echo "The pre-prod -> main pull request keeps only this lightweight policy gate."

  main-ci:
    name: Main consolidated CI
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies once
        timeout-minutes: 8
        run: node scripts/ci-install.mjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run --exclude "tests/integration/**" --exclude "tests/e2e/**"
      - name: Build
        run: npm run build

  db-migrations:
    name: Supabase migrations (fresh DB)
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Prepare dynamic Supabase local ports
        run: node scripts/prepare-local-supabase-ports.mjs
      - name: Start Supabase local
        run: supabase start -x vector,logflare
      - name: Replay all migrations
        run: supabase db reset --no-seed
      - name: Stop Supabase local
        if: always()
        run: supabase stop --no-backup || true

  build:
    name: TypeScript build
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
    runs-on: ubuntu-latest
    steps:
      - run: echo "Covered by Main consolidated CI; retained as a manual compatibility check."

  lint:
    name: ESLint
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
    runs-on: ubuntu-latest
    steps:
      - run: echo "Covered by Main consolidated CI; retained as a manual compatibility check."

  quality-metrics:
    name: Test layers metrics
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
    runs-on: ubuntu-latest
    steps:
      - run: echo "Detailed quality metrics are now opt-in to protect the monthly Actions budget."
