name: Verify Migration Status

on:
  push:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  pull_request:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  verify-migration:
    name: Verify Migration to French
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    env:
      SUPABASE_CLI_VERSION: 2.102.0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI Installation
        run: |
          set -euo pipefail
          supabase --version

      - name: Validate Supabase Configuration
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Le secret SUPABASE_PROJECT_REF est absent"
            exit 1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Le secret SUPABASE_DB_PASSWORD est absent"
            exit 1
          fi

          if [ ! -f "supabase/scripts/verify/verify-migration-status.sql" ]; then
            echo "::error::Le fichier supabase/scripts/verify/verify-migration-status.sql est introuvable"
            exit 1
          fi

      - name: Execute Migration Verification Script
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Executing migration verification script..."

          ENCODED_PASSWORD="$(
            printf '%s' "$SUPABASE_DB_PASSWORD" |
              node -e "
                process.stdin.setEncoding('utf8');
                let value = '';
                process.stdin.on('data', chunk => value += chunk);
                process.stdin.on('end', () => {
                  process.stdout.write(encodeURIComponent(value));
                });
              "
          )"

          SUPABASE_DB_URL="postgresql://postgres:${ENCODED_PASSWORD}@db.${SUPABASE_PROJECT_REF}.supabase.co:5432/postgres?sslmode=require"

          set +e

          supabase db query \
            --db-url "$SUPABASE_DB_URL" \
            --file supabase/scripts/verify/verify-migration-status.sql \
            > migration-report.txt 2>&1

          STATUS=$?

          set -e

          echo "=== MIGRATION VERIFICATION REPORT ==="
          cat migration-report.txt

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::La vérification des migrations a échoué"
            exit "$STATUS"
          fi

          if grep -Eq "❌ ERREURS|failed to parse connection string|failed to connect|connection refused|FATAL:|ERROR:" migration-report.txt; then
            echo "::error::Des erreurs critiques ont été détectées dans le rapport"
            exit 1
          fi

          if grep -q "⚠️ AVERTISSEMENTS" migration-report.txt; then
            echo "::warning::Des avertissements ont été détectés dans le rapport"
          fi

      - name: Upload Migration Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-verification-report-${{ github.run_id }}
          path: migration-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Log PR Comment Skip Reason
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "ℹ️ Commentaire PR ignoré : la PR provient d'un fork et le token GitHub Actions ne dispose pas des permissions d'écriture nécessaires."

      - name: Comment PR with Results
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 4
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const fs = require("fs");

            const marker = "<!-- migration-verification-report -->";

            let report = "";

            try {
              report = fs.readFileSync("migration-report.txt", "utf8");
            } catch {
              report = "Rapport indisponible : le script de vérification n'a pas produit de fichier.";
            }

            const maxReportLength = 60000;

            if (report.length > maxReportLength) {
              report =
                report.slice(0, maxReportLength) +
                "\n\n... rapport tronqué. Consultez l’artifact complet du workflow.";
            }

            const body = `${marker}
            ## 🔍 Migration Verification Report

            <details>
            <summary>Afficher le rapport</summary>

            \`\`\`text
            ${report}
            \`\`\`

            </details>

            **Note :** vérification automatique des migrations Supabase.
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100
              }
            );

            const existingComment = comments.find(
              comment =>
                comment.user?.type === "Bot" &&
                typeof comment.body === "string" &&
                comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
