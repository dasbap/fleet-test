name: Verify Migration Status

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/migrations/**'
      - 'supabase/verify-migration-status.sql'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'supabase/migrations/**'
      - 'supabase/verify-migration-status.sql'
  workflow_dispatch: # Permet d'exécuter manuellement depuis GitHub

jobs:
  verify-migration:
    name: Verify Migration to French
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_CLI_VERSION: latest  # Version de Supabase CLI à installer
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get npm global prefix
        id: npm-global-prefix
        run: |
          NPM_PREFIX=$(npm config get prefix)
          if [ -z "$NPM_PREFIX" ]; then
            echo "⚠️ Préfixe npm non trouvé, utilisation du préfixe par défaut"
            NPM_PREFIX="/usr/local"
          fi
          echo "prefix=$NPM_PREFIX" >> $GITHUB_OUTPUT
          echo "npm global prefix: $NPM_PREFIX"

      - name: Cache Supabase CLI
        uses: actions/cache@v4
        id: cache-supabase-cli
        with:
          path: |
            ${{ steps.npm-global-prefix.outputs.prefix }}/lib/node_modules/supabase
            ${{ steps.npm-global-prefix.outputs.prefix }}/bin/supabase
          key: supabase-cli-global-${{ runner.os }}-node-22-${{ env.SUPABASE_CLI_VERSION }}
          restore-keys: |
            supabase-cli-global-${{ runner.os }}-node-22-
            supabase-cli-global-${{ runner.os }}-

      - name: Check cache status
        run: |
          if [ "${{ steps.cache-supabase-cli.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache trouvé - Supabase CLI sera restauré depuis le cache"
          else
            echo "ℹ️ Cache non trouvé - Supabase CLI sera installé"
          fi

      - name: Install Supabase CLI
        if: steps.cache-supabase-cli.outputs.cache-hit != 'true'
        run: |
          echo "Installation de Supabase CLI (version: ${{ env.SUPABASE_CLI_VERSION }})..."
          if [ "${{ env.SUPABASE_CLI_VERSION }}" == "latest" ]; then
            npm install -g supabase@latest
          else
            npm install -g supabase@${{ env.SUPABASE_CLI_VERSION }}
          fi
          echo "✅ Supabase CLI installé avec succès"
          supabase --version

      - name: Verify Supabase CLI installation
        run: |
          supabase --version

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Linking to Supabase project: $SUPABASE_PROJECT_REF"
          supabase link --project-ref $SUPABASE_PROJECT_REF --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        continue-on-error: true

      - name: Execute migration verification script
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Executing migration verification script..."
          supabase db execute --file supabase/verify-migration-status.sql > migration-report.txt 2>&1 || true
          
          # Afficher le rapport
          echo "=== MIGRATION VERIFICATION REPORT ==="
          cat migration-report.txt
          
          # Vérifier s'il y a des erreurs critiques
          if grep -q "❌ ERREURS" migration-report.txt; then
            echo "::error::Critical errors detected in migration verification"
            exit 1
          fi
          
          if grep -q "⚠️ AVERTISSEMENTS" migration-report.txt; then
            echo "::warning::Warnings detected in migration verification"
          fi

      - name: Upload migration report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-verification-report
          path: migration-report.txt
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('migration-report.txt', 'utf8');
            } catch (e) {
              report = '(Rapport non disponible - exécution du script de vérification en échec ou fichier absent.)';
            }
            const comment = `## 🔍 Migration Verification Report

            <details>
            <summary>Click to expand report</summary>

            \`\`\`
            ${report}
            \`\`\`

            </details>

            **Note:** Vérification automatique. Consulter le rapport et agir si besoin.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
