name: Verify Migration Status

on:
  push:
    branches:
      - main
      - master
      - develop
      - PRINCIPALE
      - fix/ci-green-main
      - "release/**"
  pull_request:
    branches:
      - main
      - master
      - develop
      - PRINCIPALE
      - fix/ci-green-main
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  verify-migration:
    name: Verify Supabase migration status
    runs-on:
      - self-hosted
      - Linux
      - X64

    timeout-minutes: 15

    env:
      SUPABASE_CLI_VERSION: 2.109.1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}

      - name: Validate configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || {
            echo "::error::Le secret SUPABASE_DB_URL est absent"
            exit 1
          }

          test -f supabase/scripts/verify/verify-migration-status.sql || {
            echo "::error::Le script de vérification est introuvable"
            exit 1
          }

          supabase --version

      - name: Execute migration verification
        id: migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e

          supabase db query \
            --db-url "$SUPABASE_DB_URL" \
            --file supabase/scripts/verify/verify-migration-status.sql \
            > migration-report.txt 2>&1

          status=$?

          cat migration-report.txt

          {
            echo "status=$status"
            echo "report<<MIGRATION_REPORT_EOF"
            cat migration-report.txt
            echo "MIGRATION_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::La vérification des migrations a échoué"
            exit "$status"
          fi

          if grep -Eq "❌ ERREURS|connection refused|failed to connect|FATAL:|ERROR:" migration-report.txt; then
            echo "::error::Des erreurs ont été détectées dans le rapport"
            exit 1
          fi

          if grep -q "⚠️ AVERTISSEMENTS" migration-report.txt; then
            echo "::warning::Des avertissements ont été détectés"
          fi

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-verification-report-${{ github.run_id }}
          path: migration-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Comment pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          MIGRATION_STATUS: ${{ steps.migration.outcome }}
        with:
          script: |
            const fs = require("fs");

            const marker = "<!-- migration-verification-report -->";
            const report = fs.existsSync("migration-report.txt")
              ? fs.readFileSync("migration-report.txt", "utf8")
              : "Rapport indisponible.";

            const body = `${marker}
            ## Vérification des migrations Supabase

            **Statut :** ${process.env.MIGRATION_STATUS}

            <details>
            <summary>Afficher le rapport</summary>

            \`\`\`text
            ${report.slice(0, 60000)}
            \`\`\`

            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find(
              comment =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
