name: Verify Migration Status

on:
  push:
    branches:
      - main
      - pre-prod
      - master
      - develop
      - PRINCIPALE
      - fix/ci-green-main
      - "release/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  verify-migration:
    name: Verify Supabase migration status
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_CLI_VERSION: "2.102.0"
      SUPABASE_PROJECT_REF: idsuntuizzpdzlibafdz
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI installation
        run: |
          set -euo pipefail
          supabase --version

      - name: Validate PostgreSQL client availability
        run: |
          set -euo pipefail
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::psql ou docker est requis sur le runner pour vérifier les migrations"
            exit 1
          fi
          timeout 180 docker pull postgres:16-alpine
          docker run --rm postgres:16-alpine psql --version

      - name: Validate Supabase configuration
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo "::error::SUPABASE_PROJECT_REF est absent ou vide"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "::error::Le secret SUPABASE_DB_PASSWORD est absent ou vide"; exit 1; }
          printf '%s' "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z0-9]{20}$' || { echo "::error::SUPABASE_PROJECT_REF invalide"; exit 1; }
          test -f "supabase/scripts/verify/verify-migration-status.sql" || { echo "::error::Le fichier supabase/scripts/verify/verify-migration-status.sql est introuvable"; exit 1; }

      - name: Resolve database target
        id: db
        run: |
          set -euo pipefail
          DB_HOST="${SUPABASE_POOLER_HOST:-aws-0-eu-central-2.pooler.supabase.com}"
          DB_PORT="5432"
          DB_USER="postgres.${SUPABASE_PROJECT_REF}"
          {
            echo "host=$DB_HOST"
            echo "port=$DB_PORT"
            echo "user=$DB_USER"
          } >> "$GITHUB_OUTPUT"

      - name: Check database connectivity
        run: |
          set -euo pipefail
          DB_HOST="${{ steps.db.outputs.host }}"
          DB_PORT="${{ steps.db.outputs.port }}"
          DB_ADDRESS="$(getent ahosts "$DB_HOST" | awk '{ print $1; exit }')"
          test -n "$DB_ADDRESS" || { echo "::error::Aucune adresse trouvée pour ${DB_HOST}"; exit 1; }
          echo "Adresse Supabase database : ${DB_ADDRESS}"
          timeout 10 bash -c "exec 3<>/dev/tcp/${DB_HOST}/${DB_PORT}" || { echo "::error::Le runner ne peut pas joindre ${DB_HOST}:${DB_PORT}"; exit 1; }
          echo "Connexion TCP vers Supabase disponible."

      - name: Execute migration verification
        id: migration
        run: |
          set -euo pipefail
          DB_HOST="${{ steps.db.outputs.host }}"
          DB_PORT="${{ steps.db.outputs.port }}"
          DB_USER="${{ steps.db.outputs.user }}"
          SQL_FILE="supabase/scripts/verify/verify-migration-status.sql"

          echo "Executing migration verification script..."
          echo "Database host: ${DB_HOST}"
          echo "Database port: ${DB_PORT}"
          echo "Database user: ${DB_USER}"

          set +e
          psql \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --username="$DB_USER" \
            --dbname="postgres" \
            --file="$SQL_FILE" \
            --set=ON_ERROR_STOP=1 \
            --no-password \
            > migration-report.txt 2>&1
          STATUS=$?
          set -e

          echo "=== MIGRATION VERIFICATION REPORT ==="
          cat migration-report.txt || true
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::La vérification des migrations a échoué avec le code ${STATUS}"
            exit "$STATUS"
          fi

          if grep -Eqi "❌ ERREURS|failed to connect|connection refused|network is unreachable|no route to host|password authentication failed|FATAL:|ERROR:" migration-report.txt; then
            echo "::error::Des erreurs critiques ont été détectées dans le rapport"
            exit 1
          fi

          if grep -q "⚠️ AVERTISSEMENTS" migration-report.txt; then
            echo "::warning::Des avertissements ont été détectés dans le rapport"
          fi

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-verification-report-${{ github.run_id }}
          path: migration-report.txt
          if-no-files-found: warn
          retention-days: 30
