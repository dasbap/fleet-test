name: Verify Migration Status

on:
  push:
    branches:
      - main
      - master
      - develop
      - PRINCIPALE
      - fix/ci-green-main
      - "release/**"

  pull_request:
    branches:
      - main
      - master
      - develop
      - PRINCIPALE
      - fix/ci-green-main
      - "release/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  verify-migration:
    name: Verify Supabase migration status

    runs-on:
      - self-hosted
      - Linux
      - X64
      - ipv6

    timeout-minutes: 15

    env:
      SUPABASE_CLI_VERSION: "2.102.0"
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI installation
        run: |
          set -euo pipefail
          supabase --version

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail

          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client

          psql --version

      - name: Validate Supabase configuration
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Le secret SUPABASE_PROJECT_REF est absent ou vide"
            exit 1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Le secret SUPABASE_DB_PASSWORD est absent ou vide"
            exit 1
          fi

          if ! printf '%s' "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF doit contenir uniquement la référence du projet"
            exit 1
          fi

          if [ ! -f "supabase/scripts/verify/verify-migration-status.sql" ]; then
            echo "::error::Le fichier supabase/scripts/verify/verify-migration-status.sql est introuvable"
            exit 1
          fi

          if ! command -v psql >/dev/null 2>&1; then
            echo "::error::Le client PostgreSQL psql est introuvable"
            exit 1
          fi

      - name: Check runner IPv6 connectivity
        run: |
          set -euo pipefail

          DB_HOST="db.${SUPABASE_PROJECT_REF}.supabase.co"

          IPV6_ADDRESS="$(
            getent ahosts "$DB_HOST" |
              awk '$1 ~ /:/ { print $1; exit }'
          )"

          if [ -z "$IPV6_ADDRESS" ]; then
            echo "::error::Aucune adresse IPv6 trouvée pour ${DB_HOST}"
            exit 1
          fi

          echo "Adresse IPv6 Supabase : ${IPV6_ADDRESS}"

          GLOBAL_IPV6="$(
            ip -6 address show scope global |
              awk '/inet6/ { print $2; exit }'
          )"

          if [ -z "$GLOBAL_IPV6" ]; then
            echo "::error::Le runner ne possède aucune adresse IPv6 globale"
            exit 1
          fi

          echo "Adresse IPv6 du runner : ${GLOBAL_IPV6}"

          if ! ip -6 route show default | grep -q '^default'; then
            echo "::error::Le runner ne possède aucune route IPv6 par défaut"
            exit 1
          fi

          echo "Route IPv6 par défaut :"
          ip -6 route show default

          if ! timeout 10 bash -c "exec 3<>/dev/tcp/${DB_HOST}/5432"; then
            echo "::error::Le runner ne peut pas joindre ${DB_HOST}:5432 en IPv6"
            exit 1
          fi

          echo "Connexion TCP IPv6 vers Supabase disponible."

      - name: Execute migration verification
        id: migration
        run: |
          set -euo pipefail

          DB_HOST="db.${SUPABASE_PROJECT_REF}.supabase.co"
          SQL_FILE="supabase/scripts/verify/verify-migration-status.sql"

          echo "Executing migration verification script..."
          echo "Database host: ${DB_HOST}"

          set +e

          psql \
            --host="$DB_HOST" \
            --port="5432" \
            --username="postgres" \
            --dbname="postgres" \
            --file="$SQL_FILE" \
            --set=ON_ERROR_STOP=1 \
            --no-password \
            > migration-report.txt 2>&1

          STATUS=$?

          set -e

          echo "=== MIGRATION VERIFICATION REPORT ==="

          if [ -f migration-report.txt ]; then
            cat migration-report.txt
          else
            echo "Aucun rapport n'a été généré."
          fi

          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::La vérification des migrations a échoué avec le code ${STATUS}"
            exit "$STATUS"
          fi

          if grep -Eqi \
            "❌ ERREURS|failed to connect|connection refused|network is unreachable|no route to host|password authentication failed|FATAL:|ERROR:" \
            migration-report.txt
          then
            echo "::error::Des erreurs critiques ont été détectées dans le rapport"
            exit 1
          fi

          if grep -q "⚠️ AVERTISSEMENTS" migration-report.txt; then
            echo "::warning::Des avertissements ont été détectés dans le rapport"
          fi

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-verification-report-${{ github.run_id }}
          path: migration-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Log PR comment skip reason
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Commentaire ignoré : la pull request provient d'un fork."

      - name: Comment PR with results
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 4
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const fs = require("fs");

            const marker = "<!-- migration-verification-report -->";
            const reportPath = "migration-report.txt";

            let report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, "utf8")
              : "Rapport indisponible.";

            if (report.length > 60000) {
              report =
                report.slice(0, 60000) +
                "\n\n... rapport tronqué. Consultez l’artifact complet.";
            }

            const body = `${marker}
            ## Vérification des migrations Supabase

            **Résultat du job :** \`${{ job.status }}\`

            <details>
            <summary>Afficher le rapport</summary>

            \`\`\`text
            ${report}
            \`\`\`

            </details>`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100
              }
            );

            const existingComment = comments.find(
              comment =>
                comment.user?.type === "Bot" &&
                typeof comment.body === "string" &&
                comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
