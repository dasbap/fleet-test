name: Verify Migration Status

on:
  push:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  pull_request:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  verify-migration:
    name: Verify Migration to French
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install SQL runner dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p .ci-sql-runner
          npm --prefix .ci-sql-runner install --ignore-scripts --no-package-lock --no-audit --no-fund pg@8.18.0

      - name: Execute Migration Verification Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SQL_RUNNER_PG_MODULE: .ci-sql-runner/node_modules/pg/lib/index.js
        run: |
          set -euo pipefail
          echo "Executing migration verification script..."
          db_url="$(node scripts/resolve-supabase-db-url.mjs)"
          echo "::add-mask::$db_url"
          export DATABASE_URL="$db_url"
          export DIRECT_URL=""
          export SUPABASE_DB_URL=""
          export PGSSLMODE="no-verify"

          node scripts/apply-sql-file.mjs supabase/scripts/verify/verify-migration-status.sql > migration-report.txt 2>&1

          echo "=== MIGRATION VERIFICATION REPORT ==="
          cat migration-report.txt

          if grep -q "ERREURS" migration-report.txt; then
            echo "::error::Critical errors detected in migration verification"
            exit 1
          fi

          if grep -q "AVERTISSEMENTS" migration-report.txt; then
            echo "::warning::Warnings detected in migration verification"
          fi

      - name: Upload Migration Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-verification-report
          path: migration-report.txt
          retention-days: 30

      - name: Log PR Comment Skip Reason
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "PR comment skipped: fork pull request does not have write permissions."

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('migration-report.txt', 'utf8');
            } catch (e) {
              report = '(Report unavailable: migration verification failed before writing the report.)';
            }
            const comment = `## Migration Verification Report

            <details>
            <summary>Click to expand report</summary>

            \`\`\`
            ${report}
            \`\`\`

            </details>

            **Note:** Automated verification. Review the report if this job fails.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
