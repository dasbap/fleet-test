name: Verify Migration Status

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/migrations/**'
      - 'supabase/verify-migration-status.sql'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'supabase/migrations/**'
      - 'supabase/verify-migration-status.sql'
  workflow_dispatch: # Permet d'exécuter manuellement depuis GitHub

jobs:
  verify-migration:
    name: Verify Migration to French
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_CLI_VERSION: latest  # Version de Supabase CLI à installer
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI Installation
        run: |
          supabase --version

      - name: Link Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Linking to Supabase project: $SUPABASE_PROJECT_REF"
          supabase link --project-ref $SUPABASE_PROJECT_REF --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        continue-on-error: true

      - name: Execute Migration Verification Script
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Executing migration verification script..."
          supabase db execute --file supabase/verify-migration-status.sql > migration-report.txt 2>&1 || true
          
          # Afficher le rapport
          echo "=== MIGRATION VERIFICATION REPORT ==="
          cat migration-report.txt
          
          # Vérifier s'il y a des erreurs critiques
          if grep -q "❌ ERREURS" migration-report.txt; then
            echo "::error::Critical errors detected in migration verification"
            exit 1
          fi
          
          if grep -q "⚠️ AVERTISSEMENTS" migration-report.txt; then
            echo "::warning::Warnings detected in migration verification"
          fi

      - name: Upload Migration Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-verification-report
          path: migration-report.txt
          retention-days: 30

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('migration-report.txt', 'utf8');
            } catch (e) {
              report = '(Rapport non disponible - exécution du script de vérification en échec ou fichier absent.)';
            }
            const comment = `## 🔍 Migration Verification Report

            <details>
            <summary>Click to expand report</summary>

            \`\`\`
            ${report}
            \`\`\`

            </details>

            **Note:** Vérification automatique. Consulter le rapport et agir si besoin.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
