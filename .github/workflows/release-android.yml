# Build AAB signé pour Google Play (nécessite les secrets du dépôt).
name: Release Android (AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-release:
    name: bundleRelease (AAB)
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder-build.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets Android
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant. Voir docs/publication-stores.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Préparer Capacitor (web + sync natif)
        run: npm run mobile:prepare

      - name: Décoder le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      - name: Écrire keystore.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Secrets ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD et ANDROID_KEY_ALIAS requis."
            exit 1
          fi
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=../upload-keystore.jks"
          } > android/keystore.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Gradle bundleRelease
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
