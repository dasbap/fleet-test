name: Sync Vercel Env Self Hosted

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environnement Vercel a mettre a jour
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - development
          - all
      redeploy:
        description: Redeployer la production apres synchronisation
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: vercel-env-sync-self-hosted-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Vercel environment
    runs-on: [self-hosted, Linux]
    environment: production
    timeout-minutes: 20

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.SUPABASE_URL }}

    steps:
      - name: Validate Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Configure Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node <<'NODE'
          const { writeFileSync } = require("node:fs");

          writeFileSync(
            ".vercel/project.json",
            JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID
            }, null, 2)
          );
          NODE

      - name: Install Vercel CLI
        shell: bash
        run: npm install --global vercel@58.4.0

      - name: Verify Vercel authentication
        shell: bash
        run: vercel whoami --token "$VERCEL_TOKEN"

      - name: Sync Vercel variables
        shell: bash
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require("node:child_process");

          const publicVars = [
            "SUPABASE_ANON_KEY",
            "SUPABASE_URL",
            "VITE_SUPABASE_ANON_KEY",
            "VITE_SUPABASE_URL"
          ];

          const sensitiveVars = [
            "ADMIN_SECRET",
            "DATABASE_URL",
            "DIRECT_URL",
            "SUPABASE_DB_PASSWORD",
            "SUPABASE_DB_URL",
            "SUPABASE_POOLER_HOST",
            "SUPABASE_PROJECT_REF",
            "SUPABASE_SERVICE_ROLE_KEY"
          ];

          const targets = process.env.TARGET === "all"
            ? ["production", "preview", "development"]
            : [process.env.TARGET || "production"];

          function cleanValue(value) {
            return String(value ?? "").replace(/[\r\n]+$/g, "").trim();
          }

          function runVercel(args, input) {
            const result = spawnSync("vercel", args, {
              input,
              encoding: "utf8",
              stdio: ["pipe", "inherit", "inherit"],
              env: process.env
            });

            if (result.status !== 0) {
              process.exit(result.status ?? 1);
            }
          }

          function syncVariable(key, target, sensitive) {
            const value = cleanValue(process.env[key]);
            if (!value) {
              console.log(`Skip ${key}: valeur absente`);
              return;
            }

            console.log(`Sync ${key} -> ${target}`);
            const args = [
              "env",
              "add",
              key,
              target,
              "--force",
              "--yes",
              "--token",
              process.env.VERCEL_TOKEN
            ];

            if (sensitive && target !== "development") {
              args.push("--sensitive");
            }

            runVercel(args, value);
          }

          for (const target of targets) {
            for (const key of publicVars) syncVariable(key, target, false);
            for (const key of sensitiveVars) syncVariable(key, target, true);
          }
          NODE

      - name: Redeploy latest production deployment
        if: ${{ github.event.inputs.redeploy == 'true' && github.event.inputs.target != 'development' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require("node:child_process");

          function run(args, capture = false) {
            const result = spawnSync("vercel", args, {
              encoding: "utf8",
              stdio: capture ? ["ignore", "pipe", "inherit"] : "inherit",
              env: process.env
            });

            if (result.status !== 0) {
              process.exit(result.status ?? 1);
            }

            return result.stdout || "";
          }

          const output = run(["ls", "--prod", "--token", process.env.VERCEL_TOKEN], true);
          const latestUrl = output
            .split(/\r?\n/)
            .map((line) => line.trim())
            .find((line) => /^https:\/\/.+\.vercel\.app$/.test(line));

          if (!latestUrl) {
            throw new Error("Aucun deploiement production Vercel trouve.");
          }

          console.log(`Redeploy ${latestUrl}`);
          run(["redeploy", latestUrl, "--token", process.env.VERCEL_TOKEN]);
          NODE

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Synchronisation Vercel terminee"
            echo ""
            echo "Environnement: \`${{ github.event.inputs.target }}\`"
            echo "Redeploiement demande: \`${{ github.event.inputs.redeploy }}\`"
            echo ""
            echo "Variables publiques synchronisees si presentes:"
            echo "- SUPABASE_ANON_KEY"
            echo "- SUPABASE_URL"
            echo "- VITE_SUPABASE_ANON_KEY"
            echo "- VITE_SUPABASE_URL"
            echo ""
            echo "Variables sensibles synchronisees si presentes:"
            echo "- ADMIN_SECRET"
            echo "- DATABASE_URL"
            echo "- DIRECT_URL"
            echo "- SUPABASE_DB_PASSWORD"
            echo "- SUPABASE_DB_URL"
            echo "- SUPABASE_POOLER_HOST"
            echo "- SUPABASE_PROJECT_REF"
            echo "- SUPABASE_SERVICE_ROLE_KEY"
          } >> "$GITHUB_STEP_SUMMARY"
