name: Supabase Integration (Remote)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "tests/integration/**"
      - "supabase/seed/**"
      - ".github/workflows/supabase-integration.yml"
  push:
    branches: [main, develop]
    paths:
      - "tests/integration/**"
      - "supabase/seed/**"
      - ".github/workflows/supabase-integration.yml"
  workflow_dispatch:

jobs:
  integration-remote:
    name: Integration tests on remote Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          for key in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets manquants: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Supabase integration tests
        run: |
          mkdir -p test-results
          npx vitest run -c vitest.integration.config.ts \
            tests/integration/rls.fleet-access.test.ts \
            tests/integration/triggers.vehicle-limit.test.ts \
            tests/integration/fuel.fraud-scoring.test.ts \
            --reporter=default --reporter=json --outputFile=test-results/supabase-integration.json

      - name: Publish integration summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          let total = 'n/a';
          let failed = 'n/a';

          try {
            const result = JSON.parse(fs.readFileSync('test-results/supabase-integration.json', 'utf8'));
            total = result.numTotalTests ?? 'n/a';
            failed = result.numFailedTests ?? 'n/a';
          } catch {}

          const md = [
            '## Supabase integration (remote)',
            '',
            `- Tests: ${total}`,
            `- Echecs: ${failed}`,
            '- Seed SQL de reference: supabase/seed/test_fleet_africa.sql',
            '',
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          NODE

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-integration-results
          path: test-results/supabase-integration.json
          if-no-files-found: warn
