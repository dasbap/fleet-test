name: Sync Vercel Environment Variables

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environnement Vercel
        required: true
        default: all
        type: choice
        options:
          - all
          - production
          - preview
          - development

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_PROTOMAPS_PM_TILES_URL: ${{ vars.VITE_PROTOMAPS_PM_TILES_URL }}
      VITE_ANDROID_APK_URL: ${{ vars.VITE_ANDROID_APK_URL }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_MARKETING_URL: ${{ vars.VITE_MARKETING_URL }}
      VITE_HELP_CENTER_URL: ${{ vars.VITE_HELP_CENTER_URL }}
      VITE_PRIVACY_POLICY_URL: ${{ vars.VITE_PRIVACY_POLICY_URL }}
      VITE_TERMS_URL: ${{ vars.VITE_TERMS_URL }}
      VITE_ORANGE_MONEY_MERCHANT: ${{ vars.VITE_ORANGE_MONEY_MERCHANT }}
      VITE_MTN_MOMO_MERCHANT: ${{ vars.VITE_MTN_MOMO_MERCHANT }}

      SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      APP_URL: ${{ vars.APP_URL }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER }}
      GPS_INGEST_URL: ${{ vars.GPS_INGEST_URL }}

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
      NOTCH_PAY_API_KEY: ${{ secrets.NOTCH_PAY_API_KEY }}
      NOTCH_PAY_WEBHOOK_SECRET: ${{ secrets.NOTCH_PAY_WEBHOOK_SECRET }}
      CINETPAY_WEBHOOK_SECRET: ${{ secrets.CINETPAY_WEBHOOK_SECRET }}
      CINETPAY_API_KEY: ${{ secrets.CINETPAY_API_KEY }}
      CINETPAY_SITE_ID: ${{ secrets.CINETPAY_SITE_ID }}
      CINETPAY_SECRET_KEY: ${{ secrets.CINETPAY_SECRET_KEY }}
      GPS_INGEST_KEY: ${{ secrets.GPS_INGEST_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.0

      - name: Verify Vercel authentication
        run: vercel whoami --token "$VERCEL_TOKEN"

      - name: Configure Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {
            "orgId": "$VERCEL_ORG_ID",
            "projectId": "$VERCEL_PROJECT_ID"
          }
          EOF

      - name: Derive Supabase runtime values
        shell: bash
        run: |
          ref="$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')"
          if [[ ! "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "SUPABASE_PROJECT_REF absent ou invalide" >&2
            exit 1
          fi

          url="https://${ref}.supabase.co"
          {
            echo "SUPABASE_PROJECT_REF=$ref"
            echo "VITE_SUPABASE_URL=$url"
            echo "SUPABASE_URL=$url"
            if [ -z "${GPS_INGEST_URL:-}" ]; then
              echo "GPS_INGEST_URL=$url/functions/v1/gps-ingest"
            fi
          } >> "$GITHUB_ENV"

      - name: Validate required source variables
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Sync environment variables
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process")

          const publicVars = [
            "VITE_SUPABASE_ANON_KEY",
            "VITE_SUPABASE_URL",
            "SUPABASE_ANON_KEY",
            "SUPABASE_URL",
            "VITE_PROTOMAPS_PM_TILES_URL",
            "VITE_ANDROID_APK_URL",
            "VITE_APP_URL",
            "VITE_API_BASE_URL",
            "VITE_MAPBOX_TOKEN",
            "VITE_POSTHOG_KEY",
            "VITE_POSTHOG_HOST",
            "VITE_SENTRY_DSN",
            "VITE_MARKETING_URL",
            "VITE_HELP_CENTER_URL",
            "VITE_PRIVACY_POLICY_URL",
            "VITE_TERMS_URL",
            "VITE_ORANGE_MONEY_MERCHANT",
            "VITE_MTN_MOMO_MERCHANT",
            "APP_URL",
            "BACKEND_URL",
            "PAYMENT_PROVIDER",
            "GPS_INGEST_URL"
          ]

          const sensitiveVars = [
            "SUPABASE_SERVICE_ROLE_KEY",
            "ADMIN_SECRET",
            "SUPABASE_DB_PASSWORD",
            "SUPABASE_PROJECT_REF",
            "DIRECT_URL",
            "SUPABASE_DB_URL",
            "SUPABASE_POOLER_HOST",
            "DATABASE_URL",
            "PAYMENT_WEBHOOK_SECRET",
            "NOTCH_PAY_API_KEY",
            "NOTCH_PAY_WEBHOOK_SECRET",
            "CINETPAY_WEBHOOK_SECRET",
            "CINETPAY_API_KEY",
            "CINETPAY_SITE_ID",
            "CINETPAY_SECRET_KEY",
            "GPS_INGEST_KEY"
          ]

          const targets =
            process.env.TARGET === "all"
              ? ["production", "preview", "development"]
              : [process.env.TARGET]

          function runVercel(args, value) {
            const result = spawnSync("vercel", args, {
              input: value,
              encoding: "utf8",
              stdio: ["pipe", "inherit", "inherit"],
              env: process.env
            })
            if (result.status !== 0) process.exit(result.status ?? 1)
          }

          function syncVariable(key, target, sensitive) {
            const value = process.env[key]?.trim()
            if (!value) {
              console.log(`Skip ${key}: valeur absente`)
              return
            }

            console.log(`Sync ${key} -> ${target}`)
            const args = [
              "env",
              "add",
              key,
              target,
              "--force",
              "--yes",
              "--token",
              process.env.VERCEL_TOKEN
            ]
            if (sensitive && target !== "development") args.push("--sensitive")
            runVercel(args, value)
          }

          for (const target of targets) {
            for (const key of publicVars) syncVariable(key, target, false)
            for (const key of sensitiveVars) syncVariable(key, target, true)
          }
          NODE

      - name: Audit production runtime variables
        if: ${{ inputs.target == 'production' || inputs.target == 'all' }}
        shell: bash
        run: |
          rm -f .vercel/.env.production.audit
          vercel env pull .vercel/.env.production.audit \
            --yes \
            --environment=production \
            --token "$VERCEL_TOKEN"

          node <<'NODE'
          const fs = require("node:fs")
          const raw = fs.readFileSync(".vercel/.env.production.audit", "utf8")
          const env = {}

          for (const line of raw.split(/\r?\n/)) {
            const trimmed = line.trim()
            if (!trimmed || trimmed.startsWith("#")) continue
            const i = trimmed.indexOf("=")
            if (i < 1) continue
            const key = trimmed.slice(0, i)
            let value = trimmed.slice(i + 1)
            if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
              value = value.slice(1, -1)
            }
            env[key] = value
          }

          const required = [
            "VITE_SUPABASE_URL",
            "VITE_SUPABASE_ANON_KEY",
            "SUPABASE_URL",
            "SUPABASE_ANON_KEY",
            "SUPABASE_SERVICE_ROLE_KEY",
            "SUPABASE_PROJECT_REF"
          ]
          const missing = required.filter((key) => !env[key]?.trim())
          if (missing.length) {
            console.error(`Variables runtime Vercel manquantes: ${missing.join(", ")}`)
            process.exit(1)
          }

          const optionalSensitive = [
            "ADMIN_SECRET",
            "PAYMENT_WEBHOOK_SECRET",
            "NOTCH_PAY_API_KEY",
            "NOTCH_PAY_WEBHOOK_SECRET",
            "CINETPAY_WEBHOOK_SECRET",
            "CINETPAY_API_KEY",
            "CINETPAY_SITE_ID",
            "CINETPAY_SECRET_KEY",
            "GPS_INGEST_KEY"
          ]

          for (const key of optionalSensitive) {
            if (process.env[key]?.trim() && !env[key]?.trim()) {
              console.error(`${key} existe dans GitHub mais est absent de Vercel Production`)
              process.exit(1)
            }
          }

          function projectRef(url) {
            try {
              const host = new URL(url).hostname
              return host.endsWith(".supabase.co") ? host.slice(0, -".supabase.co".length) : "invalid"
            } catch {
              return "invalid"
            }
          }

          const expectedRef = process.env.SUPABASE_PROJECT_REF?.trim()
          const sensitivePlaceholder = String.fromCharCode(91,83,69,78,83,73,84,73,86,69,93)
          if (env.VITE_SUPABASE_URL === sensitivePlaceholder) env.VITE_SUPABASE_URL = process.env.VITE_SUPABASE_URL
          if (env.SUPABASE_URL === sensitivePlaceholder) env.SUPABASE_URL = process.env.SUPABASE_URL
          if (env.SUPABASE_PROJECT_REF === sensitivePlaceholder) env.SUPABASE_PROJECT_REF = process.env.SUPABASE_PROJECT_REF

          const publicRef = projectRef(env.VITE_SUPABASE_URL)
          const serverRef = projectRef(env.SUPABASE_URL)
          const vercelRef = env.SUPABASE_PROJECT_REF?.trim()

          if (publicRef !== expectedRef || serverRef !== expectedRef || vercelRef !== expectedRef) {
            console.error(
              `Projet Supabase incohérent: VITE=${publicRef}, serveur=${serverRef}, VercelRef=${vercelRef || "missing"}, attendu=${expectedRef}`
            )
            process.exit(1)
          }

          console.log(`Audit OK: runtime Vercel aligné sur SUPABASE_PROJECT_REF (${expectedRef})`)
          NODE

      - name: Pull production Vercel environment for build
        if: ${{ inputs.target == 'production' || inputs.target == 'all' }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build production with synchronized variables
        if: ${{ inputs.target == 'production' || inputs.target == 'all' }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Verify built frontend Supabase project
        if: ${{ inputs.target == 'production' || inputs.target == 'all' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const root = ".vercel/output/static"
          const expectedRef = process.env.SUPABASE_PROJECT_REF?.trim()

          if (!expectedRef) process.exit(1)
          if (!fs.existsSync(root)) {
            console.error(`Sortie frontend Vercel introuvable: ${root}`)
            process.exit(1)
          }

          const refs = new Map()
          const extensions = new Set([".js", ".mjs", ".html"])
          const urlPattern = /https:\/\/([a-z0-9]+)\.supabase\.co\b/g

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name)
              if (entry.isDirectory()) {
                walk(fullPath)
                continue
              }
              if (!extensions.has(path.extname(entry.name))) continue
              const content = fs.readFileSync(fullPath, "utf8")
              for (const match of content.matchAll(urlPattern)) {
                const ref = match[1]
                if (!refs.has(ref)) refs.set(ref, new Set())
                refs.get(ref).add(path.relative(root, fullPath))
              }
            }
          }

          walk(root)
          if (!refs.has(expectedRef)) {
            console.error(`Le bundle frontend ne contient pas le projet Supabase attendu (${expectedRef})`)
            process.exit(1)
          }

          const unexpected = [...refs.keys()].filter((ref) => ref !== expectedRef)
          if (unexpected.length) {
            console.error(`Le bundle frontend contient des projets Supabase inattendus: ${unexpected.join(", ")}`)
            process.exit(1)
          }
          NODE

      - name: Redeploy production with synchronized variables
        if: ${{ inputs.target == 'production' || inputs.target == 'all' }}
        run: vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

      - name: Remove pulled environment file
        if: ${{ always() }}
        shell: bash
        run: rm -f .vercel/.env.production.audit

      - name: Summary
        shell: bash
        run: |
          echo "### Synchronisation Vercel terminée" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Environnement : \`${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Variables Supabase obligatoires synchronisées et auditées." >> "$GITHUB_STEP_SUMMARY"
          echo "Variables front/BFF et secrets optionnels synchronisés lorsqu'ils existent dans GitHub." >> "$GITHUB_STEP_SUMMARY"
          echo "GPS_INGEST_URL est dérivée automatiquement depuis SUPABASE_PROJECT_REF lorsqu'elle n'est pas configurée." >> "$GITHUB_STEP_SUMMARY"
