# Vérifie que le projet iOS compile (simulateur). L’archive signée et l’upload App Store Connect
# restent en pratique réalisés depuis Xcode ou via Fastlane (voir docs/publication-stores.md).
name: Release iOS (build simulateur)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavy-ci
  cancel-in-progress: true

jobs:
  build-simulator:
    name: xcodebuild (iOS Simulator)
    runs-on: macos-14
    env:
      VITE_SUPABASE_URL: https://placeholder-build.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: Préparer Capacitor (web + sync natif)
        run: npm run mobile:prepare

      - name: Compiler pour simulateur
        run: |
          set -e
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            build
