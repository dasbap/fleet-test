name: Mutation Tests

on:
  pull_request:
    branches:
      - pre-prod
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: Mutation profile to run
        required: true
        default: critical
        type: choice
        options:
          - pr
          - critical
          - full

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.inputs.profile || 'policy' }}
  cancel-in-progress: true

jobs:
  mutation-pr:
    name: Mutation tests — PR critical gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mutation policy
        run: |
          echo "Automatic mutation testing is disabled to protect the GitHub Actions budget."
          echo "Use workflow_dispatch with profile=pr, critical or full when mutation validation is required."

  mutation-critical-shard:
    name: Critical mutation shard ${{ matrix.shard }}/8
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'critical'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: Run critical mutation shard
        env:
          MUTATION_CRITICAL_SHARD: ${{ matrix.shard }}
        run: node scripts/run-mutation-tests.mjs critical

      - name: Upload critical mutation shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-critical-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: reports/mutation/critical-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  mutation-critical:
    name: Mutation tests — manual critical
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'critical'
    needs: mutation-critical-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify critical shard jobs
        env:
          SHARDS_RESULT: ${{ needs.mutation-critical-shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "One or more critical mutation shards failed: $SHARDS_RESULT"
            exit 1
          fi
          echo "All critical mutation shards passed."

  mutation-manual:
    name: Mutation tests — manual ${{ github.event.inputs.profile }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'critical'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.profile == 'full' && 360 || 60 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 8
        run: node scripts/ci-install.mjs

      - name: Run selected mutation profile
        env:
          MUTATION_PROFILE: ${{ github.event.inputs.profile }}
        run: node scripts/run-mutation-tests.mjs

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.event.inputs.profile }}-${{ github.run_id }}
          path: reports/mutation/${{ github.event.inputs.profile }}
          retention-days: 7
