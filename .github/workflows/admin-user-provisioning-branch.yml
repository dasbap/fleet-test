name: Admin user provisioning branch test

on:
  push:
    branches:
      - test/admin-user-provisioning-live
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live-provisioning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: https://www.e-samba.com
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate secrets
        run: |
          test -n "$ADMIN_EMAIL" || { echo "::error::ADMIN_EMAIL secret missing"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "::error::ADMIN_PASSWORD secret missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY secret missing"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL variable missing"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY variable missing"; exit 1; }
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run live create-user smoke test
        run: node scripts/verify-admin-create-user-live.mjs
