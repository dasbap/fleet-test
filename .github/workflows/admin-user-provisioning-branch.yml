name: Admin user provisioning branch test

on:
  push:
    branches:
      - test/admin-user-provisioning-live
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live-provisioning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: https://www.e-samba.com
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Validate configuration
        run: |
          test -n "$ADMIN_EMAIL" || { echo "::error::ADMIN_EMAIL secret missing"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "::error::ADMIN_PASSWORD secret missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY secret missing"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL variable missing"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY variable missing"; exit 1; }
          node <<'NODE'
          const urlRef = new URL(process.env.VITE_SUPABASE_URL).hostname.split('.')[0];
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY || '';
          let keyRef = null;
          if (key.split('.').length === 3) {
            try {
              const payload = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString('utf8'));
              keyRef = payload.ref || null;
            } catch {}
          }
          console.log(`Supabase URL project ref: ${urlRef}`);
          console.log(`Service role project ref: ${keyRef ?? 'non-decodable-key'}`);
          if (keyRef && keyRef !== urlRef) {
            console.error(`::error::Supabase project mismatch: URL=${urlRef}, service_role=${keyRef}`);
            process.exit(1);
          }
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run live create-user smoke test
        run: node scripts/verify-admin-create-user-live.mjs
