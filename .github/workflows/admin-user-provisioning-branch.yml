name: Admin temporary user provisioning

on:
  push:
    branches:
      - test/admin-user-provisioning-live
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live-provisioning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: https://www.e-samba.com
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Validate configuration
        run: |
          test -n "$ADMIN_EMAIL" || { echo "::error::ADMIN_EMAIL secret missing"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "::error::ADMIN_PASSWORD secret missing"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL variable missing"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY variable missing"; exit 1; }
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Create, verify and fully delete temporary user
        run: node scripts/verify-admin-create-user-live.mjs
