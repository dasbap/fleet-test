name: Supabase Migrations Replay

on:
  pull_request:
    branches: [main, master]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations-replay.yml"
  push:
    branches: [main, master]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations-replay.yml"
  workflow_dispatch:

jobs:
  verify-migration-filenames:
    name: Verify migration filenames
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration naming convention
        run: |
          set -euo pipefail
          invalid_files="$(find supabase/migrations -maxdepth 1 -type f -name "*.sql" ! -regex ".*/[0-9]\{14\}_[a-z0-9_]\+\.sql" | sort || true)"
          if [ -n "$invalid_files" ]; then
            echo "::error::Fichiers de migration invalides détectés (format attendu: YYYYMMDDHHMMSS_description.sql)"
            echo "$invalid_files"
            exit 1
          fi
          echo "Convention de nommage des migrations OK."

  replay-migrations:
    name: Replay migrations on clean local stack
    runs-on: ubuntu-latest
    needs: verify-migration-filenames
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start --workdir supabase

      - name: Replay migrations from scratch
        run: supabase db reset --workdir supabase

