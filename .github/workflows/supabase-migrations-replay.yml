name: Supabase Migrations Replay

on:
  pull_request:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  push:
    branches: [main, master, develop, PRINCIPALE, fix/ci-green-main, release/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify-migration-filenames:
    name: Verify migration filenames
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration naming convention
        run: |
          set -euo pipefail
          bash scripts/report-legacy-migrations.sh
          shopt -s nullglob
          invalid_files=()

          for file in supabase/migrations/*.sql; do
            filename="$(basename "$file")"

            # Format strict attendu.
            if [[ "$filename" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              continue
            fi

            invalid_files+=("$file")
          done

          if [ ${#invalid_files[@]} -gt 0 ]; then
            echo "::error::Fichiers de migration invalides détectés (format attendu: YYYYMMDDHHMMSS_description.sql)"
            printf '%s\n' "${invalid_files[@]}" | sort
            exit 1
          fi

          echo "Convention de nommage des migrations OK."

  replay-migrations:
    name: Replay migrations on clean local stack
    runs-on: [self-hosted, Windows, X64]
    needs: verify-migration-filenames
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Enable local email auth for integration tests
        run: |
          $path = "supabase/config.toml"
          $text = Get-Content $path -Raw
          $text = [regex]::Replace(
            $text,
            "(?ms)(\[auth\]\s*.*?enable_signup\s*=\s*)false",
            '${1}true',
            1
          )
          $text = [regex]::Replace(
            $text,
            "(?ms)(\[auth\.email\]\s*.*?enable_signup\s*=\s*)false",
            '${1}true',
            1
          )
          Set-Content -Path $path -Value $text -NoNewline

      - name: Prepare dynamic Supabase local ports
        shell: pwsh
        run: |
          . ./scripts/_local-supabase-ports.ps1
          $portConfig = Set-LocalSupabaseTestPorts -ConfigFile "supabase/config.toml"
          Write-Host "Supabase ports: api=$($portConfig.Ports.api), db=$($portConfig.Ports.db), studio=$($portConfig.Ports.studio), inbucket=$($portConfig.Ports.inbucket), analytics=$($portConfig.Ports.analytics)."

      - name: Start Supabase local stack
        run: supabase start -x vector,logflare

      - name: Replay migrations from scratch
        run: supabase db reset --no-seed

      - name: Export local Supabase env
        # supabase status -o env peut entourer les valeurs de guillemets ("eyJ...").
        # On les supprime pour éviter que SERVICE_ROLE_KEY commence par un " invalide en base64.
        run: |
          supabase status -o env |
            ForEach-Object { $_ -replace '="(.*)"$', '=$1' } |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Supabase Vitest integration tests
        run: npm run test:integration:supabase:vitest
        env:
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
