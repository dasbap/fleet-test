name: Sync ADMIN_SECRET Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-admin-secret-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-admin-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$ADMIN_SECRET" || { echo "ADMIN_SECRET missing"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "SUPABASE_PROJECT_REF missing"; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN missing"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID missing"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Sync ADMIN_SECRET to Supabase Edge Functions
        shell: bash
        run: |
          supabase secrets set "ADMIN_SECRET=$ADMIN_SECRET" --project-ref "$SUPABASE_PROJECT_REF"
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -q 'ADMIN_SECRET'

      - name: Install Vercel CLI
        shell: bash
        run: npm install --global vercel@58.4.0

      - name: Configure Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {
            "orgId": "$VERCEL_ORG_ID",
            "projectId": "$VERCEL_PROJECT_ID"
          }
          EOF

      - name: Sync ADMIN_SECRET to Vercel Production
        shell: bash
        run: |
          printf '%s' "$ADMIN_SECRET" | vercel env add ADMIN_SECRET production --force --yes --token "$VERCEL_TOKEN"

      - name: Verify Vercel env presence
        shell: bash
        run: |
          vercel env ls production --token "$VERCEL_TOKEN" | grep -q 'ADMIN_SECRET'

      - name: Summary
        shell: bash
        run: |
          echo "ADMIN_SECRET synced to Supabase $SUPABASE_PROJECT_REF and Vercel Production." >> "$GITHUB_STEP_SUMMARY"
